name: Publish blog drafts

# Manual only, by design — the same reasoning as "Prune old Vercel previews"
# in ci.yml: this writes to production (Supabase `blog_posts`, the only store
# the site and /admin/blog use), and a manual trigger that can only ever do one
# deliberate, previewable thing is the right shape for that, not a button that
# runs on every push.
#
# `titles` is a newline-separated list of EXACT article titles — never
# "everything currently a draft". A typo is reported as "not found", and a
# title two posts share as ambiguous, never silently skipped, so a bad run
# cannot look like a successful one that published nothing.
#
# Dry run by default, same convention as `scripts/seed-blog.mjs` and
# `scripts/prune-vercel.mjs`: the preview step always runs, and nothing is
# written until `apply` is explicitly checked. Both need SUPABASE_URL
# (variable or secret) and SUPABASE_SERVICE_ROLE_KEY (secret): drafts are
# visible only to the service role.
# A real publish ends by dispatching CI on main with deploy=true, which prebuilds the new articles' pages.
on:
  workflow_dispatch:
    inputs:
      titles:
        description: "Exact article titles to publish, one per line"
        required: true
        type: string
      apply:
        description: "Actually publish (unchecked = preview only, changes nothing)"
        required: false
        type: boolean
        default: false

jobs:
  publish:
    name: Publish blog drafts by title
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # To dispatch ci.yml at the end — the one workflow event GITHUB_TOKEN may
      # start, so no new secret is needed.
      actions: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      # SUPABASE_URL isn't sensitive (it's already public in the client
      # bundle), but accept it from either the variable or the secret —
      # whichever tab it actually got added to.
      - name: Check Supabase credentials
        id: supabase-creds
        env:
          RESOLVED_SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -n "$RESOLVED_SUPABASE_URL" ] && [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::error::SUPABASE_URL (variable or secret) / SUPABASE_SERVICE_ROLE_KEY (secret) are not configured — cannot preview or publish."
            exit 1
          fi

      # Always runs, apply or not — the preview in the job log is what tells
      # you whether every title actually resolved before anything is written.
      - name: Preview
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TITLES: ${{ inputs.titles }}
        run: node scripts/publish-blog.mjs

      - name: Apply
        if: inputs.apply && steps.supabase-creds.outputs.ready == 'true'
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TITLES: ${{ inputs.titles }}
        run: node scripts/publish-blog.mjs --apply

      # Articles are prebuilt into the site at deploy time (scripts/prerender.mjs),
      # so a newly published one has a full-HTML page only after the next
      # production deploy. Only after a real publish: a preview changes nothing,
      # and a failed Apply stops the job before this. If a push to main is
      # already running, the dispatched run supersedes it (ci.yml's concurrency
      # group) and deploys the same commit.
      - name: Rebuild the site so the new articles are prebuilt
        if: inputs.apply && steps.supabase-creds.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run ci.yml --ref main -f deploy=true
