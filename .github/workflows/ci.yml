# CI/CD — install → build → test → deploy.
#
# Branches. Today the Base44 Builder syncs straight to `main`, so its edits
# land there untested — twice in one day that put a broken suite on `main`.
#
# The support for working on a Builder branch instead is already here and is
# DORMANT: everything keyed to `builder` triggers only on pushes to that
# branch, and no such branch is in use yet. Pointing the Builder at one is a
# Base44-side setting that costs Builder tokens, which is why it has not
# happened. Nothing below changes behaviour until it does — the README carries
# the switch-over.
#
# Once it is live, a push to `builder` gets the full battery, a Vercel preview
# on its own URL, and a published report. The "safe to merge" verdict is no
# longer part of that list, because it is no longer a Builder perk: every
# branch but `main` gets one, on the PR and in the run summary (see §9).
#
# What `builder` does NOT get is an automatic merge: on a branch the Builder
# replaces its Publish button with "Merge to main", and Base44 keeps each
# Builder branch as a real branch here, so merging is already its job. A CI
# job that merged `builder` into `main` would race that and leave the two
# disagreeing about what happened.
#
# Deployment: Vercel serves production (govari-fin.co.il) since 2026-10-11,
# promoted only when every test passed and the Supabase functions deployed; a
# red `main` run deploys a login-protected preview instead, because a failing
# run is when you most want to open it. So a test failure costs you
# production, never staging.
#
# Nothing is published to Base44 any more (2026-10-17): the site, its content
# writes and all four chat agents run on Vercel and Supabase, and the
# "Publish to Base44" job, the gate that held Vercel for it, and the nightly
# Base44 log archive are gone. The Base44 code still in the repo is removed
# in a follow-up once the rollback window closes (docs/base44-exit/).
name: CI

on:
  push:
    # Only the branches that deploy. `main` publishes production; `builder` is
    # named ahead of being used: the day the Base44 Builder is pointed at it,
    # its pushes are previewed and judged with no change here.
    #
    # Feature branches used to run here too, on every push, with the PR event
    # firing only on `opened`. Every new PR then started two runs for one
    # commit; the concurrency group cancelled one, and the cancelled run's
    # jobs sat in the PR's checks as failures ("UNSTABLE") next to the real,
    # green run. Branches are now tested through their PR, below.
    branches: [main, builder]
  pull_request:
    branches: [main]
    # Every commit of an open PR, once: `synchronize` is a new push to it.
    # "Safe to merge?" — the check the `protect-main` ruleset requires — comes
    # from these runs, so a PR whose latest commit has none cannot merge.
    types: [opened, reopened, synchronize]
  schedule:
    # 19:00 UTC — **22:00 in Israel while IDT is in force** (UTC+3, late March
    # to late October). GitHub cron has no timezone, so between late October
    # and late March this lands at 21:00 local. That hour of drift is accepted
    # rather than worked around: nothing here cares which hour of the night it
    # runs, and a job that rewrites its own schedule twice a year is a worse
    # thing to own than an hour of slack.
    #
    # Scheduled runs use the default branch. They deploy the Supabase functions
    # and promote the Vercel build (the usual green gate applies), so an
    # article published or edited from /admin/blog has its prebuilt page by
    # the next night.
    - cron: "0 19 * * *"

  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to production after the tests pass"
        type: boolean
        default: false

concurrency:
  # Keyed on the branch name, not on `github.ref`, because the two are not the
  # same string across the two events that fire when a PR is opened: the push
  # carries `refs/heads/<branch>`, the `opened` carries `refs/pull/<n>/merge`.
  # That put the same commit in two groups, so neither cancelled the other and
  # the whole matrix ran twice at once. Both runs then queued behind each other
  # for runner slots until the jobs that come last — e2e, the Allure publish,
  # the verdict — hit `timeout-minutes` and were killed at 15:01. The suite was
  # green; the pipeline reported red.
  #
  # The trigger below already declines `synchronize` so that a push to an open
  # PR runs once. This is the same intent applied to the one moment that
  # escaped it: the moment the PR is opened.
  #
  # Collapsing them keeps the property the ref-keyed group was there for — a
  # newer push supersedes an older run on the same branch — and `merge-readiness`
  # already declines to speak for a superseded run (`!cancelled()`), so the
  # cancelled half posts no verdict.
  group: ci-${{ github.event.pull_request.head.ref || github.ref_name }}
  # The nightly run queues behind an in-flight push instead of cancelling it:
  # cancelling a deploying push could leave Vercel on the new code and Base44
  # on the old.
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

env:
  NODE_VERSION: "22"
  # .npmrc sets `min-release-age=7`, a supply-chain cooldown that only npm >= 12
  # understands. On the npm bundled with Node 22 the setting is ignored, so CI
  # would resolve versions newer than the lockfile — `npm ci` then fails as
  # out of sync, and any install would silently skip the cooldown the policy
  # exists to enforce. Pin the client that honours it.
  NPM_VERSION: "12"

jobs:
  # ── 1. Install + static checks + build ────────────────────────────────────
  build:
    name: Install, lint, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Pin npm (honours the .npmrc release cooldown)
        run: npm i -g npm@${{ env.NPM_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Blocking, and clean: any type error fails the build. It once ran on a
      # ratchet over 93 errors inherited from the JS→TS conversion (untyped
      # `.jsx` shadcn primitives behind typed pages); the primitives now carry
      # `.d.ts` files, the baseline and its script are gone (R-08), and
      # `typecheck:gate` is plain `npm run typecheck` — the app and `api/`.
      - name: Typecheck
        run: npm run typecheck:gate

      # The e2e shards test the `dist` artifact this job uploads — they run with
      # SKIP_BUILD=1 and never build for themselves — so the artifact has to be
      # what production serves. Since prerendering that is `build:prerender`,
      # and building the plain bundle here is what made every route but `/` fall
      # through to the SPA shell in `e2e/seo/prerender.spec.ts`: the tests were
      # right and the artifact was a step behind. Changing the webServer command
      # in playwright.config.ts fixes the local run and nothing in CI.
      #
      # `build:e2e` is `build:prerender` with e2e/build-env.ts: production's
      # provider switches, pointed at a Supabase host only e2e/fixtures/app.ts
      # answers, and one fixture article for the prerender instead of the live
      # list. The same file playwright.config.ts and scripts/run-tests.sh build
      # with. The fixture is refused in any Vercel build and for any other
      # Supabase host (scripts/published-articles.mjs); workflow.contract.test.ts
      # keeps build:e2e out of every other job.
      - name: Install the browser the prerender step drives
        uses: ./.github/actions/playwright-browser

      - name: Build
        env:
          # Fail here if the browser is unavailable, rather than shipping a
          # plain bundle that fails the prerender suite three jobs later.
          PRERENDER_REQUIRED: "1"
        run: npm run build:e2e

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  # ── 2. Fast suites: unit, component, contract, integration, security ──────
  test-node:
    name: Unit, component, contract, integration, security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # The security suite runs `git ls-files`, so it needs the work tree.
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Pin npm (honours the .npmrc release cooldown)
        run: npm i -g npm@${{ env.NPM_VERSION }}

      - run: npm ci

      - name: Unit tests
        run: npm run test:unit

      - name: Component tests
        run: npm run test:component

      - name: Contract tests
        run: npm run test:contract

      # The Edge Functions run on Deno and are outside tsconfig (src/** only);
      # this is the one place their types are checked before a deploy.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check the Edge Functions
        run: deno check --no-config supabase/functions/*/index.ts

      # Runs the Base44 functions in-process against a recording client. They
      # are outside tsconfig and execute on Deno in production, so this is the
      # only place their behaviour — not their source — is checked.
      - name: Integration tests
        run: npm run test:integration

      - name: Static security tests
        run: npm run test:security

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-results
          path: test-results/
          retention-days: 7

      # The five suites above run in one job and append to a single
      # allure-results/, so this upload carries all of them. The name has to
      # match the `allure-results-*` pattern the publish job downloads, or the
      # report silently goes back to being e2e-only.
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-vitest
          path: allure-results/
          retention-days: 7

  # ── 3. How much e2e this run gets ────────────────────────────────────────
  #
  # WebKit (`web-webkit` and `ios-safari`, both `browser: webkit`) is dropped
  # from CI as of 2026-10-08. Not for its own runtime — the slow part is
  # `npx playwright install-deps webkit`, an apt install of ~150 packages
  # (GStreamer, libav*, fonts, …) that is intermittently slow on GitHub-hosted
  # runners. It blew the 10-minute per-shard timeout twice in a row on
  # 2026-10-08 (pushes 404b0c4/71826d8), once past 10m even with the browser
  # binary already cache-hit, taking real Base44 publishes down with it since
  # that job depends on every e2e shard passing. A flaky dependency install is
  # not a signal about the product, but it was blocking every merge to main.
  #
  # Chromium-based legs (`web-chromium`, `android-chrome`) cover the large
  # majority of real traffic and have been reliably fast and green. If WebKit
  # coverage needs to come back — e.g. a Safari-specific bug report — run it
  # locally (`npx playwright test --project=webkit`) or re-add it here behind
  # its own job so one slow apt mirror can't gate production again.
  #
  #   feature branch, PR      →  Chromium only, about 5 minutes
  #   main, nightly, manual   →  web-chromium + android-chrome
  #
  # main is deliberately on the full (now two-platform) matrix even though the
  # request was for feature branches and PRs: the publish job below refuses to
  # run unless test-e2e succeeded, so main's run is the gate in front of the
  # client's site. Narrowing it further would quietly weaken that gate.
  #
  # ── Sharding ──────────────────────────────────────────────────────────────
  #
  # A leg is split across runners with `--shard=i/n`, each shard a job of its
  # own. This is the only lever that actually buys wall clock here, and it is
  # worth being precise about why the obvious one does not:
  #
  #   *More workers per runner does not work.* A standard runner has two cores,
  #   so a third and fourth browser do not get a core, they get a slice of one.
  #   Measured on 2026-09-13: four workers took web-webkit 9m22 → 11m52 and then
  #   failed. Re-measured on 2026-09-15 on a 12-core machine, where the excuse
  #   of too few cores does not apply, web-chromium ran 2 workers → 35.7s,
  #   4 → 23.0s, 6 → 23.6s, 8 → 25.1s, 10 → 31.8s, 12 → 34.2s. The curve turns
  #   upwards well before the core count: browsers are not CPU-bound here, and
  #   crowding them makes every one of them slower. See playwright.config.ts.
  #
  #   *More runners does work*, because each shard is two more real cores.
  #
  # Chromium is the only leg left, at two shards — the number already bought
  # for web-chromium before the WebKit legs were dropped. Every shard re-pays
  # its own setup — checkout, npm ci, the browser, the dist artifact, call it
  # two minutes — so this trades total job-minutes for wall clock.
  #
  # Feature branches stay on a single Chromium shard. That path is already
  # ~5 minutes, over half of it setup, so a second shard would roughly double
  # its cost to save about a minute — on the event that fires most often.
  plan:
    name: Choose the e2e matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
      depth: ${{ steps.pick.outputs.depth }}
    steps:
      - name: Decide which platforms this run needs
        id: pick
        run: |
          # project:browser:shards — the shard count lives next to the platform
          # it pays for, so the two policies are read and changed together.
          #
          # WebKit (web-webkit, ios-safari) is deliberately absent — see the
          # comment above this job for why.
          full='web-chromium:chromium:2 android-chrome:chromium:2'
          quick='web-chromium:chromium:1'

          # Expanded to one matrix entry per shard. `shard` and `shards` stay
          # separate fields rather than a single "1/3": that string is fine for
          # --shard but illegal in an artifact name, and every shard uploads one.
          expand() {
            local entry project browser shards shard out=""
            for entry in $1; do
              IFS=: read -r project browser shards <<<"$entry"
              for shard in $(seq 1 "$shards"); do
                out="${out}{\"project\":\"$project\",\"browser\":\"$browser\",\"shard\":$shard,\"shards\":$shards},"
              done
            done
            echo "[${out%,}]"
          }

          case "${{ github.event_name }}:${{ github.ref }}" in
            schedule:*|workflow_dispatch:*|*:refs/heads/main|*:refs/heads/builder)
              echo "matrix=$(expand "$full")" >> "$GITHUB_OUTPUT"
              echo "depth=web-chromium + android-chrome, sharded across 4 runners (WebKit dropped — see plan job comment)" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "matrix=$(expand "$quick")" >> "$GITHUB_OUTPUT"
              echo "depth=Chromium only — main/nightly also covers android-chrome" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Say so in the run summary
        run: echo "**e2e depth:** ${{ steps.pick.outputs.depth }}" >> "$GITHUB_STEP_SUMMARY"

  # ── 3b. e2e: UI, API, security and accessibility, per platform shard ──────
  test-e2e:
    name: e2e (${{ matrix.project }} ${{ matrix.shard }}/${{ matrix.shards }})
    runs-on: ubuntu-latest
    needs: [build, plan]
    # Per shard, not per platform: a shard is a fraction of a leg, so 30 minutes
    # stopped being a timeout and became a licence. Ten covers the slowest leg
    # (9m22) even unsharded, which is the failure this is meant to catch.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Pin npm (honours the .npmrc release cooldown)
        run: npm i -g npm@${{ env.NPM_VERSION }}

      - run: npm ci

      # The browser and its OS packages, both from caches when they can be: see
      # .github/actions/playwright-browser for why the Ubuntu mirror is avoided.
      - name: Install Playwright browser and OS packages
        uses: ./.github/actions/playwright-browser
        with:
          browser: ${{ matrix.browser }}

      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # SKIP_BUILD: the dist/ artifact from the build job is what we test.
      #
      # --shard splits the leg by test, balanced by file, and Playwright makes
      # the split itself — the shards do not need to agree with each other about
      # anything beyond n. A single-shard leg (feature branches) passes 1/1,
      # which is a no-op.
      #
      # The nightly run also shuffles, to surface a test that passes only because
      # of what ran before it. PRs keep the fixed order so a red PR means the
      # change. Shuffling happens after sharding (it reorders only the shard's
      # own tests), so shards still cover the suite exactly once. The seed is the
      # run id: it shows in the log ("shuffle seed …"), and `--shuffle=<id>`
      # replays that order locally; a re-run of the job replays it too.
      #
      # Such a test usually fails once and passes on retry in a fresh worker, so
      # it surfaces as *flaky* (job annotations, the nightly Allure report), not
      # as a red run. That is deliberate: --fail-on-flaky-tests would also turn
      # every ordinary timing flake red, and a red test-e2e stops the nightly
      # production promotion.
      - name: Run e2e suite
        run: >-
          npx playwright test --project=${{ matrix.project }} --shard=${{ matrix.shard }}/${{ matrix.shards }}
          ${{ github.event_name == 'schedule' && format('--shuffle={0}', github.run_id) || '' }}
        env:
          SKIP_BUILD: "1"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

      # Raw Allure results, kept per platform shard so the allure job can merge
      # every leg — plus the Vitest job's upload — into one report. Generating
      # per-leg would give a pile of partial reports instead of one picture of
      # the run, and sharding only makes that worse: the merge is what keeps a
      # three-way split of web-webkit readable as one platform.
      #
      # The name still matches the `allure-results-*` pattern the publish job
      # downloads, which is the only contract between the two jobs.
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.project }}-${{ matrix.shard }}
          path: allure-results/
          retention-days: 7

  # ── 4. Deploy (main only) ────────────────────────────────────────────────
  #
  # A red test run stops here and goes no further. `needs` without always()
  # means every one of these jobs must have *succeeded* — this is the gate that
  # keeps a known-broken build off the client's site, and it is deliberately
  # the strictest one in the file. Staging still deploys; see deploy-vercel.
  # ── Supabase Edge Functions ───────────────────────────────────────────────
  # The backend the site calls for claims (and, piece by piece, the rest). On
  # green main only — the same rule as the Base44 publish — and before either
  # production goes out, so the site is never live ahead of the function it
  # calls. The token is scoped to Edge Functions read-write on this one
  # project. Without it the job fails, and so neither production goes out: a
  # skip would satisfy both gates, and once a function is live a lost or
  # expired token would ship new frontends against stale functions while the
  # smoke — which asks only "is it deployed" — stayed green.
  deploy-supabase:
    name: Deploy Supabase functions
    runs-on: ubuntu-latest
    needs: [build, test-node, test-e2e]
    # `schedule` too: the nightly run promotes Vercel, and --prod waits for
    # this job, so the site is never live ahead of the functions it calls.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'schedule' || inputs.deploy)
    timeout-minutes: 10
    env:
      SUPABASE_PROJECT_REF: hjowdyiwjjrqceumkvgt
    steps:
      - uses: actions/checkout@v4

      - name: Check deploy credentials
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN2 }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not set (GitHub secret SUPABASE_ACCESS_TOKEN2) — the Edge Functions cannot be deployed, so neither production is published."
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Migrations are applied to production by hand (README). Before the
      # functions that may depend on one go out — and so before Vercel is
      # promoted, which waits for this job — every migration in the repository
      # must be in production's history (Architecture N-05; two were applied
      # but never recorded until 15 October). A listing that cannot be read
      # warns rather than blocking a deploy on a read failure; drift fails.
      #
      # Its own token: reading the project (`supabase link`) needs
      # `project_admin_read`, which the functions-deploy token does not carry —
      # the first run on main found exactly that. SUPABASE_MIGRATIONS_TOKEN is a
      # Supabase access token that can read the project; until it is set, the
      # step falls back to the deploy token and says what is missing.
      - name: Every migration is applied in production
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_MIGRATIONS_TOKEN || secrets.SUPABASE_ACCESS_TOKEN2 }}
        # The Management API, not `supabase link`: link also reads the project's
        # API keys (service_role included); this needs database_migrations_read.
        run: |
          status=$(curl -sS --max-time 30 -o remote.json -w '%{http_code}' \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/migrations") || status=000
          if [ "$status" != 200 ]; then
            echo "::warning::Could not read production's migration history (HTTP $status) — not checked. A scoped token needs database_migrations_read; set SUPABASE_MIGRATIONS_TOKEN to one that has it."; cat remote.json 2>/dev/null; exit 0
          fi
          node scripts/check-migrations.mjs remote.json supabase/migrations

      # No function named: every directory under supabase/functions except
      # `_shared`, with each one's verify_jwt from supabase/config.toml.
      # --use-api bundles on Supabase's side, so the runner needs no Docker.
      - name: Deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN2 }}
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF" --use-api

  # ── 5. Deploy the built site to Vercel ───────────────────────────────────
  #
  # Staging deploys even when the tests are red — that is the point of it. A
  # failing run is exactly when you want the broken build somewhere you can
  # open, next to the Allure report that says what broke. The site is
  # login-protected, so nobody outside the team can reach it.
  #
  # Two things still stop it:
  #   - the build failing, since there would be nothing to deploy; asserted
  #     explicitly, because always() would otherwise run this job on a red
  #     build and fail confusingly inside `vercel build`
  #   - the run being cancelled — !cancelled() rather than always(), so a
  #     superseded push (concurrency cancels in-progress runs) does not race a
  #     deployment out of a half-finished run
  deploy-vercel:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: [build, test-node, test-e2e, deploy-supabase]
    outputs:
      url: ${{ steps.deploy.outputs.url }}
      deployed: ${{ steps.deploy.outputs.deployed }}
      kind: ${{ steps.target.outputs.kind }}
      asset: ${{ steps.built.outputs.asset }}
      previous_asset: ${{ steps.before.outputs.asset }}
    # Also on `builder`, where it deploys a *preview* rather than production.
    # That is the point of the branch: a Builder edit gets a URL you can open
    # and look at before you merge it, instead of being judged from a diff.
    # The nightly run (`schedule`) rebuilds production so every prebuilt
    # article page is current — see README, "When an article's page is rebuilt".
    if: >-
      !cancelled() &&
      needs.build.result == 'success' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/builder') &&
      (github.event_name == 'push' || github.event_name == 'schedule' || inputs.deploy)
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'vercel' || 'vercel-preview' }}
      url: ${{ steps.deploy.outputs.url }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Pin npm (honours the .npmrc release cooldown)
        run: npm i -g npm@${{ env.NPM_VERSION }}

      - run: npm ci

      - name: Check Vercel credentials
        id: creds
        run: |
          if [ -n "${{ secrets.VERCEL_TOKEN }}" ] && [ -n "${{ vars.VERCEL_SCOPE }}" ] && [ -n "${{ vars.VERCEL_PROJECT_NAME }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::VERCEL_TOKEN secret, or the VERCEL_SCOPE / VERCEL_PROJECT_NAME variables, are unset — skipping the Vercel deploy."
          fi

      # Confirm the token can actually see the project before doing any work.
      # The first run failed with "Could not retrieve Project Settings", which
      # is what a scope mismatch looks like — the ID env vars are only honoured
      # when the token's scope owns that project.
      - name: Verify the token reaches the project
        if: steps.creds.outputs.ready == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SCOPE: ${{ vars.VERCEL_SCOPE }}
        run: |
          who=$(npx vercel whoami --token "$VERCEL_TOKEN" 2>&1 | tail -1) || true
          echo "Token identity: $who"
          if ! npx vercel project ls --scope "$SCOPE" --token "$VERCEL_TOKEN" >/dev/null 2>&1; then
            echo "::error::VERCEL_TOKEN cannot list projects in scope '$SCOPE'. Recreate the token at https://vercel.com/account/tokens with that scope selected."
            exit 1
          fi

      # main deploys production; `builder` deploys a preview on its own URL.
      # One job rather than two: everything else about the two is identical,
      # and a second copy would drift from this one within a week.
      # Deploying on red is the point of staging; *promoting* on red is not.
      #
      # The job's own `if:` only requires `build` to have succeeded, which is
      # deliberate — a failing run is exactly when you want the thing somewhere
      # you can open it. But on `main` this step used to hand `--prod` to the
      # CLI regardless, and `needs:` does not gate, it only orders. That was
      # harmless while Vercel was staging behind a login. It stops being
      # harmless at README step 1: once the customer domain points here, and
      # with `vercel.json` disabling Git-triggered builds on `main` so CI is the
      # only promoter, a red push would land on customers.
      #
      # So a red run still deploys — as a preview, on its own URL, which is the
      # artefact you actually wanted. Only `--prod` waits for green.
      - name: Choose production or preview
        id: target
        env:
          UNIT: ${{ needs.test-node.result }}
          E2E: ${{ needs.test-e2e.result }}
          FUNCTIONS: ${{ needs.deploy-supabase.result }}
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ] \
            && [ "$UNIT" = "success" ] && [ "$E2E" = "success" ] \
            && [ "$FUNCTIONS" = "success" ]; then
            echo "prod=--prod" >> "$GITHUB_OUTPUT"
            echo "env=production" >> "$GITHUB_OUTPUT"
            echo "kind=production" >> "$GITHUB_OUTPUT"
          else
            if [ "$GITHUB_REF" = "refs/heads/main" ]; then
              echo "::warning::Not promoting (unit: ${UNIT}, e2e: ${E2E}, functions: ${FUNCTIONS}) — deploying this as a preview instead of production."
            fi
            echo "prod=" >> "$GITHUB_OUTPUT"
            echo "env=preview" >> "$GITHUB_OUTPUT"
            echo "kind=preview" >> "$GITHUB_OUTPUT"
          fi

      # Link by name and scope rather than by ID env vars. IDs only resolve when
      # the token's scope matches; the name+scope pair is unambiguous and gives
      # a readable error when it is not.
      - name: Build for Vercel
        if: steps.creds.outputs.ready == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SCOPE: ${{ vars.VERCEL_SCOPE }}
          PROJECT: ${{ vars.VERCEL_PROJECT_NAME }}
          # Production must prebuild every published article: a Supabase it
          # cannot read fails this build instead of shipping a blog without its
          # pages. A preview warns and goes on (scripts/published-articles.mjs).
          PRERENDER_REQUIRED: ${{ steps.target.outputs.env == 'production' && '1' || '0' }}
        run: |
          npx vercel link --yes --project "$PROJECT" --scope "$SCOPE" --token "$VERCEL_TOKEN"
          npx vercel pull --yes --environment=${{ steps.target.outputs.env }} --scope "$SCOPE" --token "$VERCEL_TOKEN"
          npx vercel build ${{ steps.target.outputs.prod }} --token "$VERCEL_TOKEN"
          # The CSP is enforced and allows inline scripts by hash only. One whose
          # text changed (the gtag snippet, say) would be refused without a sound.
          # Fatal for production; a preview only warns.
          if [ "${{ steps.target.outputs.env }}" = production ]; then
            node scripts/check-csp-hashes.mjs .vercel/output/static
          else
            node scripts/check-csp-hashes.mjs .vercel/output/static || echo "::warning::A preview inline script is outside the CSP (see above); production would refuse to deploy it."
          fi

      # The bundle this production deploy serves, read from the output being
      # deployed. The smoke waits until production serves exactly this, which is
      # at once when the commit left the frontend unchanged — rather than waiting
      # for the bundle to *change*, which never happens then and used to cost the
      # full eight-minute timeout (scripts/wait-for-deployment.mjs).
      - name: Record the release being deployed
        id: built
        if: steps.creds.outputs.ready == 'true' && steps.target.outputs.env == 'production'
        run: |
          asset=$(grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' .vercel/output/static/index.html | head -1 || true)
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
          echo "This deploy serves: ${asset:-unknown}"

      # What production serves *now*, before this deploy replaces it — the
      # smoke's fallback when the asset below cannot be read
      # (scripts/wait-for-deployment.mjs).
      - name: Record the release production is serving
        id: before
        if: steps.creds.outputs.ready == 'true' && steps.target.outputs.env == 'production'
        continue-on-error: true
        run: |
          asset=$(curl -fsSL --max-time 30 "${{ vars.PRODUCTION_URL }}" \
            | grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' | head -1 || true)
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
          echo "Production currently serves: ${asset:-unknown}"

      - name: Deploy
        id: deploy
        if: steps.creds.outputs.ready == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SCOPE: ${{ vars.VERCEL_SCOPE }}
        run: |
          # npx can interleave notices on stdout, so take the last https line
          # rather than trusting the whole capture to be just the URL.
          #
          # --archive=tgz uploads one tarball instead of one request per file.
          # The free plan allows 5000 uploads per 24h, and this pipeline blew
          # through that in a day — mostly on the Allure report, which was
          # published here at the time and is thousands of small JSON files —
          # leaving deploys dead with "api-upload-free" until the window rolled
          # over. The report is not deployed anywhere at all now — it is a
          # single file attached to the run — but this flag stays: the budget
          # is per-account and a built site is plenty of files on its own.

          url=$(npx vercel deploy --prebuilt ${{ steps.target.outputs.prod }} --archive=tgz --scope "$SCOPE" --token "$VERCEL_TOKEN" \
                | grep -oE 'https://[^[:space:]]+' | tail -1)
          if [ -z "$url" ]; then
            echo "::error::Vercel deploy produced no URL"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "deployed=true" >> "$GITHUB_OUTPUT"
          echo "::notice::Deployed a ${{ steps.target.outputs.kind }} to $url"

      - name: Verify the deployment serves the app
        if: steps.creds.outputs.ready == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          # The project keeps Vercel Authentication on, so an anonymous curl is
          # answered with a 302 to a login page. `vercel curl` carries the
          # bypass, which is what makes this a real check rather than a ping.
          # No --token here: `vercel curl` forwards flags it does not recognise
          # to the real curl, which rejects --token. It authenticates from the
          # VERCEL_TOKEN environment variable instead, which this step sets.
          body=$(npx vercel curl "$URL/")
          echo "$body" | grep -q '<div id="root">' \
            || { echo "::error::Deployment did not serve the app shell"; exit 1; }
          echo "$body" | grep -q 'lang="he"' \
            || { echo "::error::Deployment did not serve the Hebrew RTL document"; exit 1; }
          # /blog is a file (blog.html) and, since articles are prebuilt, also a
          # directory (blog/<slug>.html). Production must still answer /blog
          # with the blog index's own page, not the shell or a 404.
          if [ "${{ steps.target.outputs.env }}" = production ]; then
            blog=$(npx vercel curl "$URL/blog")
            echo "$blog" | grep -qE '<link rel="canonical" href="[^"]*/blog"' \
              || { echo "::error::/blog is not served its prebuilt page"; exit 1; }
          fi

      # IndexNow: tell Bing and the other IndexNow engines which articles changed
      # in the last 48 hours, read from the sitemap now being served. Production
      # only, and it can never fail the deploy (scripts/indexnow.mjs warns instead).
      - name: Tell IndexNow about new and changed articles
        if: steps.creds.outputs.ready == 'true' && steps.target.outputs.env == 'production'
        continue-on-error: true
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: node scripts/indexnow.mjs

  # ── 6. Post-deploy smoke test against the live site ──────────────────────
  #
  # Waits on both publishes and smokes whatever `PRODUCTION_URL` names, rather
  # than assuming which host is the client-facing one. That assumption is about
  # to change: production moves from Base44 to Vercel with the custom domain, and
  # a smoke wired to one publisher would either stop running or keep testing the
  # host nobody visits any more. This way the cutover is a variable, not an edit.
  #
  # Check the publisher of PRODUCTION_URL before starting browsers. A successful
  # job can have skipped its publish step, and a staging deploy is not production.
  smoke:
    name: Production smoke test
    runs-on: ubuntu-latest
    needs: [deploy-vercel]
    if: >-
      !cancelled() &&
      github.ref == 'refs/heads/main' &&
      vars.PRODUCTION_URL != '' &&
      needs['deploy-vercel'].result == 'success'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Pin npm (honours the .npmrc release cooldown)
        run: npm i -g npm@${{ env.NPM_VERSION }}

      - name: Verify production was published by this run
        run: node scripts/check-production-publish.mjs
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
          VERCEL_DEPLOYED: ${{ needs.deploy-vercel.outputs.deployed }}
          VERCEL_KIND: ${{ needs.deploy-vercel.outputs.kind }}

      # A deploy that returned is not a release that is being served. An edge
      # can keep handing out the previous bundle for minutes, and the smoke
      # then fails on whatever the new release added — which is exactly how
      # `#start` went red at publish time and green against the same URL later.
      - name: Wait for the new release to reach the edge
        run: node scripts/wait-for-deployment.mjs
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
          PREVIOUS_ASSET: ${{ needs['deploy-vercel'].outputs.previous_asset }}
          EXPECTED_ASSET: ${{ needs['deploy-vercel'].outputs.asset }}

      # The Vercel functions are bundled apart from the app, without the "@/"
      # alias, and #218 found one crashing on load in production behind a green
      # build (Architecture N-05). Ask each for an answer only a loaded function
      # gives: a 404 for a missing article, a 405 for a GET. A function that
      # cannot load answers 500.
      - name: Probe the Vercel functions
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          base="${PRODUCTION_URL%/}"
          probe() {
            code=$(curl -s -o /dev/null -w "%{http_code}" "$base$1")
            echo "$1 → $code (expected $2)"
            [ "$code" = "$2" ] || { echo "::error::$1 answered $code, expected $2 — 500 means the function did not load"; return 1; }
          }
          probe "/api/og/blog?id=smoke-probe-missing" 404
          probe "/api/csp-report" 405

      - run: npm ci
      - name: Install Playwright browser and OS packages
        uses: ./.github/actions/playwright-browser

      # Against a real deployment the API/UI/a11y suites run untouched; the
      # security suite additionally enforces the transport hardening headers.
      #
      # E2E_LIVE_API_URL additionally turns on the opt-in live block in
      # e2e/api/supabase-live.spec.ts, the part of the battery that talks to
      # the real backend (Supabase and its Edge functions, with the key the
      # deployed bundle carries) rather than to a stub. Without it this job
      # smoke-tests the published *bundle* against a mock and reports green
      # while every call behind it 401s — which is exactly how three dead chats
      # went unnoticed for ten days (A-42). The "Live Base44 backend" block is
      # no longer run here: production does not use Base44 (2026-10-17).
      # A skip is a pass, and this job is the one place where that is fatal:
      # its whole purpose is to answer "does the deployed thing work". Assert
      # the inputs exist before the suite runs, so a missing variable fails
      # here — naming itself — instead of quietly reducing the smoke to a
      # check that the bundle was uploaded.
      - name: The live backend probes must be able to run
        env:
          LIVE_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          missing=""
          [ -n "$LIVE_URL" ] || missing="$missing vars.PRODUCTION_URL"
          if [ -n "$missing" ]; then
            echo "::error::The live-backend probes would skip silently. Missing:${missing}"
            exit 1
          fi

      - name: Smoke the deployment
        run: npx playwright test --project=web-chromium e2e/api e2e/ui/home.spec.ts e2e/a11y
        env:
          PLAYWRIGHT_BASE_URL: ${{ vars.PRODUCTION_URL }}
          E2E_ENFORCE_SECURITY_HEADERS: "0"
          # The guard above makes a skip of the live block impossible rather
          # than merely unlikely: an empty URL once skipped every live case and
          # the job went green having tested nothing against the backend.
          E2E_LIVE_API_URL: ${{ vars.PRODUCTION_URL }}
          # "supabase" once the lead functions are switched on: the smoke then
          # requires submit-lead to report Google ready. Unset, it is not asked.
          E2E_EXPECT_GOOGLE: ${{ vars.LEAD_FUNCTIONS }}
          # No E2E_LEAD_FUNCTIONS any more: the form posts to submit-lead in the
          # e2e build and in production alike, so backend-contract.spec.ts no
          # longer asks which (2026-10-18).

      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-smoke
          path: playwright-report/
          retention-days: 14

  # ── 7. Where the two sites live ──────────────────────────────────────────
  # Written to the run summary on every run, including when a deploy was
  # skipped, so the links are always one click from the Actions tab rather
  # than something you have to remember or dig out of a log.
  sites:
    name: Deployed sites
    runs-on: ubuntu-latest
    needs: [deploy-vercel, test-node, test-e2e, allure]
    # `main` only. On `builder` the URL is a preview of one change rather than
    # a site anyone lives on, and merge-readiness already reports it — two
    # tables calling the same URL different things is worse than one. On a
    # feature branch nothing is deployed at all, so the table would be three
    # rows of "not deployed" on every push.
    if: always() && github.ref == 'refs/heads/main'

    steps:
      - name: Write the site links to the run summary
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
          VERCEL_URL: ${{ needs.deploy-vercel.outputs.url }}
          VERCEL_RESULT: ${{ needs.deploy-vercel.result }}
          UNIT_RESULT: ${{ needs.test-node.result }}
          TESTS_RESULT: ${{ needs.test-e2e.result }}
          ALLURE_RESULT: ${{ needs.allure.result }}
          ALLURE_URL: ${{ needs.allure.outputs.url }}
          ALLURE_ALIAS: ${{ needs.allure.outputs.alias }}
          PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          vercel_link="${VERCEL_URL:-https://vercel.com/amielnoy-9725s-projects/dorit-finance-site}"

          # The permanent home of the test report: the `main` branch alias, which
          # always serves the newest report from the trunk. Derived from the same
          # variable the deploy uses rather than written out, so renaming the
          # Pages project cannot leave a dead link in the summary.
          ALLURE_HOME=""
          if [ -n "$PAGES_PROJECT" ]; then
            ALLURE_HOME="https://main.${PAGES_PROJECT}.pages.dev"
          fi

          # Did anything go red? That is what splits the two environments now:
          # staging takes the build either way, production does not.
          if [ "$UNIT_RESULT" = "success" ] && [ "$TESTS_RESULT" = "success" ]; then
            tests_green=true
          else
            tests_green=false
          fi

          case "$VERCEL_RESULT" in
            success)
              if [ -z "$VERCEL_URL" ]; then
                vercel_state="⏭️ not deployed — deployment credentials are missing"
              elif [ "$tests_green" = true ]; then
                vercel_state="✅ deployed this run"
              else
                vercel_state="⚠️ deployed with failing tests — staging deploys either way"
              fi ;;
            skipped)  vercel_state="⏭️ not deployed (this run was not a push to main)" ;;
            failure)  vercel_state="❌ deploy failed — the link is the previous deployment" ;;
            *)        vercel_state="⚠️ $VERCEL_RESULT" ;;
          esac


          {
            echo "## Deployed sites"
            echo
            echo "| Environment | URL | This run |"
            echo "| --- | --- | --- |"
            if [ -n "$PRODUCTION_URL" ]; then
              echo "| **Production** (client-facing) | ${PRODUCTION_URL} | smoke-tested after every publish |"
            fi
            if [ -n "$ALLURE_URL" ]; then
              # The stable branch link in the URL column — it is the one to
              # bookmark — and this run's immutable copy beside it, since the
              # alias moves on to whatever deploys next.
              echo "| **Allure — test report** (Cloudflare, behind Access) | ${ALLURE_ALIAS:-$ALLURE_URL} | [deployed this run](${ALLURE_URL}) |"
            elif [ -n "$ALLURE_HOME" ]; then
              # This run published nothing — only `main`, `builder` and a manual
              # dispatch do. The hosted report still exists and is still the
              # place people look, so name it and say plainly that it is the
              # last `main` run rather than this one. A blank row here sent
              # people hunting for a URL that was up the whole time.
              if [ "$ALLURE_RESULT" = "success" ]; then
                echo "| **Allure — test report** (Cloudflare, behind Access) | ${ALLURE_HOME} | latest \`main\`; this run's copy is the [\`allure-report\` artifact](${RUN_URL}) |"
              else
                echo "| **Allure — test report** (Cloudflare, behind Access) | ${ALLURE_HOME} | latest \`main\`; this run built none (${ALLURE_RESULT}) |"
              fi
            elif [ "$ALLURE_RESULT" = "success" ]; then
              echo "| **Allure — test report** | [\`allure-report\` on this run](${RUN_URL}) | attached to this run |"
            else
              echo "| **Allure — test report** | — | not built (${ALLURE_RESULT}) |"
            fi
            # Staging goes last, under production and the report. It is the row
            # you reach for once one of those two has told you something is
            # wrong — and it is the only one here that deploys on a red run, so
            # putting it above them read like the headline when it never is.
            echo "| **Vercel** (staging — the built site) | ${vercel_link} | ${vercel_state} |"
            echo
            echo "Unit suites: **${UNIT_RESULT}** · e2e across all four platforms: **${TESTS_RESULT}**"
            echo
            echo "> A red run still deploys to **staging** — the point is to be able to open the broken build"
            echo "> next to the report that says what broke. **Production is held back until the run is green.**"
            echo "> The Vercel staging link answers anonymous requests with a 302; sign in to Vercel to view it."
            echo ">"
            echo "> The test report also rides on this run as the \`allure-report\` artifact — one self-contained"
            echo "> \`index.html\`, no server needed (over Allure's single-file size limit, the split report:"
            echo "> \`npx allure open allure-report\`). The Cloudflare copy sits behind Cloudflare Access, which CI"
            echo "> re-checks on every deploy: the repository is private and the report carries the client's copy."
          } >> "$GITHUB_STEP_SUMMARY"

  # ── 8. Attach the merged Allure report to the run ────────────────────────
  #
  # The report goes to two places, in two shapes, from one set of results:
  #
  #   - **This run**, as the `allure-report` artifact: one self-contained
  #     index.html that opens from the filesystem — or, over Allure's
  #     single-file size limit, the split report, served with
  #     `npx allure open allure-report`. Always produced, needs no
  #     credentials, and visible to exactly the people who can already see this
  #     private repository.
  #
  #   - **Cloudflare Pages**, as the ordinary multi-file report, when the
  #     credentials are set. Cloudflare refuses any single asset over 25 MiB
  #     and a full run's single-file report is ~46 MB, so the hosted copy has
  #     to be the split one (~4,000 files against a 20,000-file ceiling).
  #
  # The hosted copy must not be world-readable — it carries the client's copy
  # and screenshots of her site — so the deploy is followed by a step that
  # fetches it anonymously and fails if the report comes back. Cloudflare
  # Access is configured in the dashboard, not from here, and a protection
  # that nothing checks is a protection that silently lapses.
  allure:
    name: Build and deploy Allure report
    runs-on: ubuntu-latest
    # Both test jobs, or the report races the vitest artifact and publishes
    # without it.
    needs: [test-node, test-e2e]
    # always(): a failing run is exactly when the report is worth reading.
    # Builder runs publish it too: a red `builder` run is the one someone
    # actually has to read, and it is the only place that says why main did
    # not move.
    #
    # Every branch gets a report, because a feature branch is exactly where a
    # red run needs reading and the artifact costs nothing to produce. Only
    # `main` and `builder` publish it — see the deploy condition below.
    if: always()

    outputs:
      url: ${{ steps.cfdeploy.outputs.url }}
      alias: ${{ steps.cfdeploy.outputs.alias }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Pin npm (honours the .npmrc release cooldown)
        run: npm i -g npm@${{ env.NPM_VERSION }}

      - run: npm ci

      - name: Collect the results from every platform
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: allure-parts

      - name: Merge into one results directory
        run: |
          mkdir -p allure-results
          # Each artifact unpacks to its own directory; flatten them together.
          find allure-parts -type f -exec cp -n {} allure-results/ \; 2>/dev/null || true
          echo "merged $(ls allure-results | wc -l) result files"

      - name: Upload the results to the test dashboard
        continue-on-error: true
        env:
          TEST_DASHBOARD_SUPABASE_URL: ${{ secrets.TEST_DASHBOARD_SUPABASE_URL }}
          TEST_DASHBOARD_SUPABASE_KEY: ${{ secrets.TEST_DASHBOARD_SUPABASE_KEY }}
        run: node scripts/test-dashboard/upload.mjs allure-results

      # History makes the trend graphs meaningful across runs; without it every
      # report claims to be the first one. Allure 3 reads and rewrites
      # `allure-history/history.jsonl` itself (`historyPath` in allurerc.mjs),
      # so restoring the cache is the whole mechanism — none of the copying in
      # and out of the report directory that Allure 2 needed.
      - name: Restore report history
        uses: actions/cache@v4
        with:
          path: allure-history
          key: allure-history-${{ github.run_id }}
          restore-keys: allure-history-

      # Also strips the Google Analytics beacon Allure injects into every
      # report — see scripts/strip-allure-analytics.mjs for why that is not
      # just a config flag.
      #
      # The single-file report has a size ceiling, and a full run passed it in
      # October 2026 (~3,600 tests): "The report is too large to be generated in
      # the single file mode!" failed the job on main while everything it
      # reports on was green. On exactly that message the run's copy becomes the
      # split report — the one Cloudflare already hosts — which has to be served
      # rather than opened from disk (`npx allure open allure-report`). Any
      # other failure still fails the job.
      # A bigger heap: at ~4,500 tests the generator died at Node's default
      # (~4 GB, "JavaScript heap out of memory", 17 October 2026) with every
      # suite green. The repository is public, so the runner has 16 GB.
      - name: Generate the report
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          set -o pipefail
          if npm run allure:generate 2>&1 | tee allure-generate.log; then exit 0; fi
          grep -q "too large to be generated in the single file mode" allure-generate.log || exit 1
          echo "::warning::The single-file report is over Allure's size limit; this run's allure-report artifact is the split report — open it with: npx allure open allure-report"
          rm -rf allure-report
          ALLURE_SINGLE_FILE=0 npx allure generate allure-results -c allurerc.mjs -o allure-report
          node scripts/strip-allure-analytics.mjs allure-report/index.html

      - name: Attach the report to this run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 14

      # Opt-in, like every other deploy here: no credentials, no deployment,
      # and the run still goes green with the report on it as an artifact.
      #
      # Restricted to the two long-lived branches. Every branch builds a report
      # — that is the artifact above — but a repository has one Pages site, and
      # letting every feature branch overwrite it would mean the URL shows
      # whichever branch pushed last rather than the state of the trunk.
      - name: Check Cloudflare credentials
        id: cf
        if: >-
          github.ref == 'refs/heads/main' ||
          github.ref == 'refs/heads/builder' ||
          github.event_name == 'workflow_dispatch'
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ] && [ -n "$PROJECT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets or the CLOUDFLARE_PAGES_PROJECT variable are unset — the report is attached to this run and was not deployed."
          fi

      # The split report, for Cloudflare's 25 MiB-per-asset limit. Same results,
      # same analytics strip — see allurerc.mjs.
      - name: Build the hosted copy
        if: steps.cf.outputs.ready == 'true'
        run: npm run allure:generate:site

      # Idempotent, and the `--production-branch` is the point of it: set to a
      # name this pipeline never pushes, so every deploy below is a *preview*
      # deployment. That is the only kind Cloudflare's one-click access policy
      # protects — the toggle does not cover the production domain. A failure
      # here usually just means the project already exists, so it is not fatal;
      # the deploy step is the real check.
      - name: Ensure the Pages project exists
        if: steps.cf.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          if npx wrangler pages project create "$PROJECT" --production-branch production >/dev/null 2>&1; then
            echo "::notice::Created Cloudflare Pages project '$PROJECT' with production branch 'production', so CI deploys land as preview deployments."
          else
            echo "Project '$PROJECT' already exists, or could not be created — the deploy step will say which."
          fi


      # --branch is the git ref, never Cloudflare's configured production
      # branch: that makes every one of these a *preview* deployment, which is
      # the only thing the project's one-click "Enable access policy" toggle
      # protects. Cloudflare's own docs are explicit that the toggle does not
      # cover the `*.pages.dev` production domain or a custom domain — those
      # need an Access application in Zero Trust covering the hostname.
      - name: Deploy to Cloudflare Pages
        id: cfdeploy
        if: steps.cf.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          # Keep wrangler's own output in the log — piping it straight into
          # grep meant a failed deploy showed nothing but "produced no URL".
          out=$(npx wrangler pages deploy allure-report-site \
                  --project-name "$PROJECT" \
                  --branch "$GITHUB_REF_NAME" \
                  --commit-hash "$GITHUB_SHA" \
                  --commit-dirty=true 2>&1)
          echo "$out"

          # Two URLs, and which one belongs in a summary differs:
          #
          #   url   — `<hash>.<project>.pages.dev`, immutable, this run's copy.
          #   alias — `<branch>.<project>.pages.dev`, stable, always the latest
          #           deploy of the branch. This is the one worth bookmarking.
          #
          # Both are preview deployments, so both sit behind the access policy.
          # The bare `<project>.pages.dev` is neither: it is the production
          # domain, which this pipeline never deploys to and which the toggle
          # does not cover — publishing it would hand out a dead link that is
          # also the one hostname with nothing in front of it.
          url=$(printf '%s\n' "$out" | grep -vi alias | grep -oE 'https://[^[:space:]]+\.pages\.dev' | tail -1)
          alias=$(printf '%s\n' "$out" | grep -i alias | grep -oE 'https://[^[:space:]]+\.pages\.dev' | tail -1)
          if [ -z "$url" ]; then
            echo "::error::wrangler produced no deployment URL"
            exit 1
          fi
          # wrangler has not always printed the alias line. Derive it rather
          # than drop the stable link from the summary when it doesn't:
          # Cloudflare lowercases the branch, replaces anything not
          # alphanumeric with a hyphen, and truncates.
          if [ -z "$alias" ]; then
            slug=$(printf '%s' "$GITHUB_REF_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g' | cut -c1-28 | sed 's/-*$//')
            alias="https://${slug}.${PROJECT}.pages.dev"
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "alias=$alias" >> "$GITHUB_OUTPUT"
          echo "::notice::Allure report deployed to $alias (this run's copy: $url)"

      # The requirement is that it is not world-readable, so assert it rather
      # than assume the dashboard is still set the way someone left it. Access
      # answers an anonymous request with its own login page, so a 200 alone
      # proves nothing — what must not come back is the report itself.
      #
      # Reports; does not block. The check was written to fail the run and it
      # was right to — the report was world-readable and nobody knew. But it
      # gates a pipeline whose other job is publishing the site, and a main
      # branch that is permanently red over a test report is one everybody
      # learns to scroll past, which costs more than this protects.
      #
      # So it stays, loudly, on every run. Restore `exit 1` once Access covers
      # both hostnames: from then on the check is silent in the normal case and
      # a failure means a real regression rather than a standing condition.
      # Leaving it non-blocking after that is the mistake this note exists to
      # prevent.
      - name: Verify the report is not world-readable
        if: steps.cf.outputs.ready == 'true'
        env:
          URL: ${{ steps.cfdeploy.outputs.url }}
          ALIAS: ${{ steps.cfdeploy.outputs.alias }}
        run: |
          # Both hostnames, because both are published in the run summary and
          # Access is applied per hostname. Checking only the one nobody opens
          # is how a protection lapses without anyone noticing.
          for target in "$URL" "$ALIAS"; do
            [ -n "$target" ] || continue
            code=$(curl -sL -o anon.html -w '%{http_code}' "$target/" || echo 000)
            if grep -qi 'allure\|Dorit Gov-Ari' anon.html 2>/dev/null; then
              echo "::warning::${target} served the report to an anonymous request (HTTP ${code}). Cloudflare Access is not in front of it — anyone with the link can read this run's test report. Fix: Workers & Pages → dorit-allure → Settings → Preview access → Restrict previews covers the per-deployment URLs; the branch alias needs its own Zero Trust Access application, because production pages.dev is managed separately. Warning rather than failure by decision — see the note above this step."
              continue
            fi
            echo "::notice::${target} answered an anonymous request with HTTP ${code} and no report content — Access is in front of it."
          done

      # The links, in the job that produced them.
      #
      # The report was announced with `::notice::` alone, which lands at the top
      # of the run and scrolls away behind every other annotation, and the table
      # that names it properly lives in the `sites` job — which runs on `main`
      # and nowhere else. So on every other branch the report was deployed and
      # its address appeared in no place anyone would look for it.
      - name: Write the report link to the run summary
        if: always() && steps.cfdeploy.outputs.url != ''
        env:
          URL: ${{ steps.cfdeploy.outputs.url }}
          ALIAS: ${{ steps.cfdeploy.outputs.alias }}
          PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          # Derived rather than written out, so renaming the Pages project moves
          # this link with it instead of leaving one dead one behind. With the
          # project named `dorit-allure` it resolves to
          # https://main.dorit-allure.pages.dev — the report to bookmark.
          main_home="https://main.${PROJECT}.pages.dev"
          {
            echo "## Allure — test report"
            echo
            echo "| Report | URL |"
            echo "| --- | --- |"
            echo "| Latest on \`main\` | ${main_home} |"
            # Only when it is a different address: on a `main` run the branch
            # alias *is* the trunk link, and two rows with one URL read like a
            # mistake.
            if [ -n "$ALIAS" ] && [ "$ALIAS" != "$main_home" ]; then
              echo "| Latest on \`${GITHUB_REF_NAME}\` | ${ALIAS} |"
            fi
            echo "| This run's copy | ${URL} |"
            echo
            echo "> Behind Cloudflare Access — sign in to open it."
          } >> "$GITHUB_STEP_SUMMARY"




  # ── 8b. Why did it fail? AI triage of the Allure results ───────────────────
  #
  # A red run used to mean opening the report and working out, failure by
  # failure, whether the site broke, the test broke, or CI broke. This job does
  # that first pass. A script (scripts/ci-triage/groq_triage.py) gathers the
  # merged Allure results through the read-only triage helpers, groups the
  # failures by error signature, and one call to a Groq-hosted model (free
  # plan) labels each group PRODUCT_BUG,
  # AUTOMATION_BUG, CONFIGURATION_BUG or NEEDS_HUMAN, with the evidence: the
  # message and stack, retries, Allure history, attachments, and what this
  # branch changed in app code, test code and config.
  #
  # Only on a red test job, and only advisory. It never changes the colour of a
  # run: "Safe to merge?" still decides from the test results alone, and folds
  # this job's write-up into its one PR comment. On `main` it goes to the run
  # summary.
  #
  # Opt-in, like every deploy here: without the GROQ_API_KEY secret (or on a
  # fork PR, which gets no secrets) it says so and stops green. The model gets
  # the evidence as text and no tools at all, because test output is untrusted
  # text and could contain instructions.
  triage:
    name: Triage the failures (AI)
    runs-on: ubuntu-latest
    # `allure` so its history cache for this run exists before it is restored.
    needs: [test-node, test-e2e, allure]
    if: ${{ !cancelled() && (needs.test-node.result == 'failure' || needs.test-e2e.result == 'failure') }}
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # The diff against the base is evidence: a failure right after an
          # app-code change reads differently from one after a config change.
          fetch-depth: 0

      - name: Collect the results from every platform
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: allure-parts

      - name: Merge into one results directory
        run: |
          mkdir -p allure-results
          find allure-parts -type f -exec cp -n {} allure-results/ \; 2>/dev/null || true
          echo "merged $(ls allure-results | wc -l) result files"

      # Includes this run's own entry; the MCP server ignores runs newer than
      # the earliest result, so the history it reports is the past only.
      - name: Restore report history
        uses: actions/cache/restore@v4
        with:
          path: allure-history
          key: allure-history-${{ github.run_id }}
          restore-keys: allure-history-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run the triage
        id: run
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # Optional repository variable; the script's default is openai/gpt-oss-120b.
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          BASE_CANDIDATE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "::notice::No GROQ_API_KEY secret, so no AI triage this run. Add it under Settings → Secrets and variables → Actions to turn it on."
            exit 0
          fi

          # A new branch's push carries an all-zero `before`, and a nightly run
          # carries none: fall back to the previous commit.
          base="$BASE_CANDIDATE"
          if [ -z "$base" ] || ! git rev-parse --verify --quiet "${base}^{commit}" >/dev/null; then
            base="HEAD~1"
          fi

          # mcp 2.x renamed the server API the helpers use, hence the cap.
          pip install --quiet "mcp>=1.2,<2"

          export ALLURE_RESULTS_DIR="$GITHUB_WORKSPACE/allure-results"
          export ALLURE_HISTORY_FILE="$GITHUB_WORKSPACE/allure-history/history.jsonl"
          export TRIAGE_BASE_REF="$base"
          export TEST_PATH_REGEX='^(e2e|tests)/'
          export CONFIG_PATH_REGEX='^\.github/|^package(-lock)?\.json$|^\.npmrc$|^(playwright|playwright\.measure|vitest)\.config\.ts$|^vite\.config\.js$|^vercel\.json$|^supabase/config\.toml$|^allurerc\.mjs$|^Dockerfile|^docker-compose|^tsconfig\.json$|^eslint\.config\.js$'
          [ -n "$GROQ_MODEL" ] || unset GROQ_MODEL

          # Never fatal: a triage that cannot run is reported, not failed.
          if python scripts/ci-triage/groq_triage.py > triage.md 2> triage.err; then
            echo "::notice::AI triage written."
          else
            echo "::warning::The AI triage did not finish — see this step's log."
            cat triage.err
            printf '### 🧪 Failure triage (AI)\n\n_The triage did not finish on this run; the Allure report has the details._\n' > triage.md
          fi

          # The machine-readable verdict, for anything that wants to act on it.
          python - <<'PY'
          import json, re
          text = open("triage.md", encoding="utf-8").read()
          blocks = re.findall(r"```json\s*(\{.*?\})\s*```", text, re.S)
          try:
              data = json.loads(blocks[-1]) if blocks else {"clusters": []}
          except json.JSONDecodeError:
              data = {"clusters": [], "error": "unparseable json block"}
          json.dump(data, open("triage.json", "w"), indent=2)
          # The JSON block is for machines; the comment reads better without it.
          open("triage.md", "w", encoding="utf-8").write(
              re.sub(r"\s*```json\s*\{.*?\}\s*```\s*$", "\n", text, flags=re.S))
          for c in ("PRODUCT_BUG", "AUTOMATION_BUG", "CONFIGURATION_BUG", "NEEDS_HUMAN"):
              n = sum(x.get("count", 1) for x in data.get("clusters", []) if x.get("category") == c)
              print(f"{c}: {n} test(s)")
          PY

          cat triage.md >> "$GITHUB_STEP_SUMMARY"

      - name: Attach the triage to this run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failure-triage
          path: |
            triage.md
            triage.json
          if-no-files-found: ignore
          retention-days: 14

  # ── 9. Is this safe to merge? ────────────────────────────────────────────
  #
  # This job was gated to `builder` and skipped everywhere else, which meant the
  # check named "Safe to merge?" never produced a verdict on the branches people
  # actually open pull requests from. A green PR showed no verdict, no preview
  # link and no report link — the one question the job exists to answer went
  # unanswered on every PR. It now runs on every branch except `main`, where
  # there is nothing left to merge and the "Deployed sites" table says more.
  #
  # CI reports; it does not merge. On a Builder branch that is because Base44
  # owns promotion — the Builder replaces its Publish button with "Merge to
  # main", and it keeps each Builder branch as a real branch here, so a CI job
  # that merged would race it and leave the two disagreeing about what happened.
  # On an ordinary PR it is because nobody asked for an unattended merge. Either
  # way the enforcement that matters is downstream: publishing happens only from
  # main, and the publish job there demands a green run.
  #
  # The verdict goes two places. The run summary, as before, and — when the
  # commit has an open PR — a comment on it, edited in place so there is one
  # comment that is always about the latest run rather than a pile of stale
  # ones. That matters more than usual here: `pull_request` fires only on
  # `opened`/`reopened` (see the trigger), so most runs on a PR arrive as pushes
  # and a create-only comment would freeze at whatever the first run said.
  #
  # And it fails when the answer is no. A check called "Safe to merge?" sitting
  # green next to a body that says "do not merge" is worse than no check at all.
  # Nothing depends on this job, so the failure costs nothing but the red mark
  # it is there to give.
  merge-readiness:
    name: Safe to merge?
    runs-on: ubuntu-latest
    # `triage` only adds its write-up to the comment; the verdict ignores it.
    needs: [build, test-node, test-e2e, deploy-vercel, allure, triage]
    # `!cancelled()` rather than `always()`. `always()` includes cancellation,
    # and this workflow sets `cancel-in-progress: true` — so pushing twice in
    # quick succession cancelled run #1, whose verdict job still ran, read
    # `E2E == 'cancelled'`, overwrote the PR's one edited comment with "do not
    # merge" and failed the check. A superseded run has no opinion worth
    # posting; the run that replaced it does.
    if: ${{ !cancelled() && github.ref != 'refs/heads/main' }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Compose the verdict
        id: verdict
        env:
          BUILD: ${{ needs.build.result }}
          UNIT: ${{ needs.test-node.result }}
          E2E: ${{ needs.test-e2e.result }}
          PREVIEW_URL: ${{ needs.deploy-vercel.outputs.url }}
          ALLURE_RESULT: ${{ needs.allure.result }}
          ALLURE_URL: ${{ needs.allure.outputs.url }}
          ALLURE_ALIAS: ${{ needs.allure.outputs.alias }}
          PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          IS_BUILDER: ${{ github.ref == 'refs/heads/builder' || github.head_ref == 'builder' }}
          # Production is named here even though this job never moves it. A
          # branch run's summary used to carry the preview and the report and
          # nothing else, so the one address the verdict is actually protecting
          # was the one you had to go and look up.
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          # The report's permanent home — the `main` alias, newest trunk report.
          # This job runs on every branch but `main`, and a feature branch never
          # publishes, so without this the verdict mentioned no hosted report at
          # all and the URL looked like it did not exist.
          ALLURE_HOME=""
          if [ -n "$PAGES_PROJECT" ]; then
            ALLURE_HOME="https://main.${PAGES_PROJECT}.pages.dev"
          fi

          if [ "$BUILD" = "success" ] && [ "$UNIT" = "success" ] && [ "$E2E" = "success" ]; then
            green=true
            verdict="## ✅ Safe to merge"
            if [ "$IS_BUILDER" = "true" ]; then
              advice="Everything passed. Press **Merge to main** in the Builder; the publish from main is gated on a green run there too."
            else
              advice="Everything passed. The publish from main is gated on a green run there too, so merging is the last judgement call."
            fi
          else
            green=false
            verdict="## 🛑 Do not merge yet"
            if [ "$IS_BUILDER" = "true" ]; then
              advice="Something is red. Open the report below, fix it in the Builder, and push again — merging now would put this on main."
            else
              advice="Something is red. Open the report below and fix it on this branch — merging now would put it on main."
            fi
          fi
          echo "green=$green" >> "$GITHUB_OUTPUT"

          {
            echo "$verdict"
            echo
            echo "$advice"
            echo
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Build · lint · typecheck | ${BUILD} |"
            echo "| Unit · component · contract · security | ${UNIT} |"
            echo "| e2e across four platforms | ${E2E} |"
            echo
            # One table, the same three rows `main` gets from the "Deployed
            # sites" job, so the answer to "where do I look" does not depend on
            # which branch the run was on. Ordered by what a red verdict means:
            # production is what is being protected, the report says what broke,
            # staging is where you open the broken build next to it.
            echo "| Where to look | URL | This run |"
            echo "| --- | --- | --- |"

            echo "| **Production** (Vercel — client-facing) | ${PRODUCTION_URL:-https://govari-fin.co.il} | unchanged — production deploys only from a green \`main\` |"

            if [ -n "$ALLURE_URL" ]; then
              echo "| **Allure — test report** (behind Cloudflare Access) | ${ALLURE_ALIAS:-$ALLURE_URL} | [this run's copy](${ALLURE_URL}) |"
            elif [ -n "$ALLURE_HOME" ] && [ "$ALLURE_RESULT" = "success" ]; then
              # A feature branch never publishes to Cloudflare, so the hosted
              # address shows `main`, not this branch. Say which, or the report
              # reads as this run's and quietly disagrees with the verdict above.
              echo "| **Allure — test report** (behind Cloudflare Access) | ${ALLURE_HOME} | latest \`main\`; this branch's is the [\`allure-report\` artifact](${RUN_URL}) |"
            elif [ "$ALLURE_RESULT" = "success" ]; then
              echo "| **Allure — test report** | [\`allure-report\` on this run](${RUN_URL}) | self-contained \`index.html\`, or the split report over the size limit |"
            else
              echo "| **Allure — test report** | — | not built (${ALLURE_RESULT}) |"
            fi

            if [ -n "$PREVIEW_URL" ]; then
              echo "| **Vercel** (staging — this change, built) | ${PREVIEW_URL} | deployed this run |"
            else
              echo "| **Vercel** (staging) | — | not deployed; only \`main\` and \`builder\` deploy |"
            fi
            echo
            echo "> Both links need a sign-in: Vercel answers anonymous requests with a 302, and the"
            echo "> report sits behind Cloudflare Access because this repository is private and the"
            echo "> report carries the client's copy."
            echo
            if [ "$IS_BUILDER" = "true" ]; then
              echo "> Heads-up: every Builder branch shares the app's **live data**. The tests never"
              echo "> touch it, but anything you do by hand in the Builder writes to real records."
              echo
            fi
            echo "<sub>[This run](${RUN_URL}) · re-runs replace this comment rather than adding one.</sub>"
          } > verdict.md

      # The AI triage, when the tests failed and it ran. Appended to this
      # comment rather than posted as its own, because the comment below is
      # edited with --edit-last: a second comment from the same bot would be
      # the one overwritten. Missing artifact = nothing to add.
      - name: Fetch the failure triage, if there is one
        if: needs.triage.result == 'success'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: failure-triage
          path: triage

      - name: Add it to the verdict
        run: |
          if [ -s triage/triage.md ]; then
            { echo; echo "---"; echo; cat triage/triage.md; } >> verdict.md
          fi

      - name: Write it to the run summary
        run: cat verdict.md >> "$GITHUB_STEP_SUMMARY"

      # Only if the commit has an open PR. A push to a branch with no PR yet
      # still gets the run summary above, so nothing is lost by staying quiet
      # here — and `gh pr list` is what makes this work on a push event, where
      # there is no PR context in the payload at all.
      #
      # Never fatal. This step reports; the verdict itself is already in the run
      # summary and the step below is what colours the check. A posting failure
      # is an infrastructure problem, and failing here would turn every PR red
      # for a reason that has nothing to do with the code under test — while
      # saying nothing about why.
      #
      # The likely reason is named explicitly because it is invisible from the
      # log otherwise: this repository's default workflow permissions are
      # read-only (Settings → Actions → General → Workflow permissions). The
      # job-level `permissions:` block above asks for `pull-requests: write`;
      # if that setting caps it, the API answers 403 and the comment silently
      # never appears — which is exactly the symptom this job was fixed to cure.
      - name: Post it on the pull request, if there is one
        env:
          GH_TOKEN: ${{ github.token }}
          PR_FROM_EVENT: ${{ github.event.pull_request.number }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          pr="$PR_FROM_EVENT"
          if [ -z "$pr" ]; then
            pr=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty') || true
          fi
          if [ -z "$pr" ]; then
            echo "::notice::No open PR for ${BRANCH} — the verdict is in the run summary only."
            exit 0
          fi
          # --edit-last keeps one comment per PR. It errors when there is no
          # previous one, hence the fallback rather than a version-dependent
          # --create-if-none.
          if gh pr comment "$pr" --edit-last --body-file verdict.md \
            || gh pr comment "$pr" --body-file verdict.md; then
            echo "::notice::Verdict posted on PR #${pr}."
          else
            echo "::warning::Could not comment on PR #${pr}. The verdict is in the run summary. If this is a 403, set Settings → Actions → General → Workflow permissions to 'Read and write permissions' — this repository is currently on read-only, which caps the pull-requests: write this job asks for."
          fi

      # Last, so the verdict is published either way before this decides the
      # colour of the check.
      - name: Fail if the answer is no
        if: steps.verdict.outputs.green != 'true'
        run: |
          echo "::error::Not safe to merge — see the verdict on the PR and in the run summary."
          exit 1

  prune-vercel:
    name: Prune old Vercel previews
    runs-on: ubuntu-latest
    # The nightly run only, not `workflow_dispatch`. This one deletes. A manual
    # trigger sitting next to the "deploy" button is how someone clears a
    # preview they were halfway through reading, and there is no undo. The schedule is the whole
    # interface; to preview what it would do, run `npm run prune:vercel` with
    # no `--apply` locally.
    if: ${{ github.event_name == 'schedule' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The same three, checked the same way, as the deploy job.
      - name: Check Vercel credentials
        id: creds
        run: |
          if [ -n "${{ secrets.VERCEL_TOKEN }}" ] && [ -n "${{ vars.VERCEL_SCOPE }}" ] && [ -n "${{ vars.VERCEL_PROJECT_NAME }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::VERCEL_TOKEN secret, or the VERCEL_SCOPE / VERCEL_PROJECT_NAME variables, are unset — nothing was pruned."
          fi

      - name: Install
        if: steps.creds.outputs.ready == 'true'
        run: npm ci --ignore-scripts

      - name: Delete previews older than a month
        if: steps.creds.outputs.ready == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_SCOPE: ${{ vars.VERCEL_SCOPE }}
          VERCEL_PROJECT_NAME: ${{ vars.VERCEL_PROJECT_NAME }}
        run: npm run prune:vercel -- --apply
