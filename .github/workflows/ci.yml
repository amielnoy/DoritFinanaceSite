# CI/CD — install → build → test → deploy.
#
# Branches. Today the Base44 Builder syncs straight to `main`, so its edits
# land there untested — twice in one day that put a broken suite on `main`.
#
# The support for working on a Builder branch instead is already here and is
# DORMANT: everything keyed to `builder` triggers only on pushes to that
# branch, and no such branch is in use yet. Pointing the Builder at one is a
# Base44-side setting that costs Builder tokens, which is why it has not
# happened. Nothing below changes behaviour until it does — the README carries
# the switch-over.
#
# Once it is live, a push to `builder` gets the full battery, a Vercel preview
# on its own URL, and a published report. The "safe to merge" verdict is no
# longer part of that list, because it is no longer a Builder perk: every
# branch but `main` gets one, on the PR and in the run summary (see §9).
#
# What `builder` does NOT get is an automatic merge: on a branch the Builder
# replaces its Publish button with "Merge to main", and Base44 keeps each
# Builder branch as a real branch here, so merging is already its job. A CI
# job that merged `builder` into `main` would race that and leave the two
# disagreeing about what happened.
#
# The two deployment targets are gated differently, on purpose:
#
#   Vercel (staging, login-protected) — deploys whenever the build succeeds,
#   green or red. A failing run is when you most want to open the thing.
#
#   Base44 (production, client-facing) — deploys only when every test passed.
#
# So a test failure costs you production, never staging.
#
# Deploy note: this repo syncs to Base44 through git (see README), and a git
# sync still needs a Publish in the Builder to reach users. The deploy job can
# do that publish unattended instead, then smoke-test the live site. It is
# opt-in — it runs only when the BASE44_API_KEY secret and BASE44_APP_ID
# variable are set, so a fork or a fresh clone gets a green CI with no
# credentials.
#
# BASE44_API_KEY is a workspace API key — it starts with `b44k_`. It is the only
# credential the CLI reads from the environment besides a BASE44_ACCESS_TOKEN /
# BASE44_REFRESH_TOKEN pair, which expires and so cannot live in a secret;
# `base44 login` is a device-code flow and cannot run unattended.
name: CI

on:
  push:
    # Every branch, so work in progress is tested where it is cheap to fix
    # rather than at the merge. `main` and `builder` are not special here —
    # they are special further down, where the deploy jobs check the ref. A
    # feature branch runs the full battery and deploys nothing.
    #
    # (`builder` is named ahead of being used: the day the Base44 Builder is
    # pointed at it, its pushes are previewed and judged with no change here.)
    branches: ['**']
  pull_request:
    branches: [main]
    # Only the moment the PR appears. New commits on the branch already
    # trigger the push event above, and checks attach to the commit either
    # way, so reacting to `synchronize` as well would run the whole matrix
    # twice for every push to an open PR.
    types: [opened, reopened]
  schedule:
    # 19:00 UTC — **22:00 in Israel while IDT is in force** (UTC+3, late March
    # to late October). GitHub cron has no timezone, so between late October
    # and late March this lands at 21:00 local. That hour of drift is accepted
    # rather than worked around: nothing here cares which hour of the night it
    # runs, and a job that rewrites its own schedule twice a year is a worse
    # thing to own than an hour of slack.
    #
    # Scheduled runs use the default branch, and no deploy job can fire from
    # them — every one requires `github.event_name == 'push'`.
    - cron: "0 19 * * *"

  workflow_dispatch:
    inputs:
      deploy:
        description: "Publish to Base44 after the tests pass"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  # .npmrc sets `min-release-age=7`, a supply-chain cooldown that only npm >= 12
  # understands. On the npm bundled with Node 22 the setting is ignored, so CI
  # would resolve versions newer than the lockfile — `npm ci` then fails as
  # out of sync, and any install would silently skip the cooldown the policy
  # exists to enforce. Pin the client that honours it.
  NPM_VERSION: "12"
  VITE_BASE44_APP_ID: e2e-sanity-app

jobs:
  # ── 1. Install + static checks + build ────────────────────────────────────
  build:
    name: Install, lint, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Pin npm (honours the .npmrc release cooldown)
        run: npm i -g npm@${{ env.NPM_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Blocking, on a ratchet.
      #
      # `tsc` reports 93 errors inherited from the JS→TS conversion. Every one
      # of them sits in a `.tsx` file that passes props to an untyped `.jsx`
      # shadcn primitive — TypeScript sees `RefAttributes<any>` and rejects the
      # lot. None are in the JavaScript files, and none are bugs. Flipping this
      # step to blocking as it stood would have painted CI red without finding
      # anything.
      #
      # What it cost while advisory: a genuinely new type error landed silently
      # among the 93 and nobody had to fix it. So the gate allows for exactly
      # the inherited set (tests/typecheck-baseline.json, keyed by file and
      # error code, never by line) and fails on anything on top of it.
      #
      # Fixed some? `npm run typecheck:baseline` lowers the bar; commit it.
      - name: Typecheck (blocks on new errors)
        run: npm run typecheck:gate

      # The e2e shards test the `dist` artifact this job uploads — they run with
      # SKIP_BUILD=1 and never build for themselves — so the artifact has to be
      # what production serves. Since prerendering that is `build:prerender`,
      # and building the plain bundle here is what made every route but `/` fall
      # through to the SPA shell in `e2e/seo/prerender.spec.ts`: the tests were
      # right and the artifact was a step behind. Changing the webServer command
      # in playwright.config.ts fixes the local run and nothing in CI.
      #
      # The Base44-builder guard below deliberately stays on the plain `build`:
      # that is the command Base44 runs, and prerendering it would test a build
      # nobody performs.
      - name: Install the browser the prerender step drives
        run: npx playwright install --with-deps chromium

      - name: Build
        env:
          # Fail here if the browser is unavailable, rather than shipping a
          # plain bundle that fails the prerender suite three jobs later.
          PRERENDER_REQUIRED: "1"
        run: npm run build:prerender

      # Publishing from the Base44 dashboard stays supported, so the build has to
      # keep working without anything this workflow supplies. CI sets
      # VITE_BASE44_APP_ID globally and Vercel adds VITE_SITE_URL, which means the
      # build above proves nothing about the Builder's environment — a step that
      # started requiring either of them would pass here and fail there, after a
      # publish, on production.
      #
      # `env -u` rather than a separate job: same checkout, a few seconds, and it
      # fails next to the build it is guarding.
      #
      # `--outDir` is not tidiness. Without it this wrote over `dist/`, and the
      # upload below then shipped *this* bundle as the `dist` artifact — the one
      # every e2e shard downloads. Since the point of the step is to strip
      # VITE_BASE44_APP_ID, the whole suite was running against a bundle whose
      # app id inlined to `undefined`, posting every form to
      # `/api/apps/undefined/...`, and staying green only because
      # e2e/fixtures/app.ts stubs `**/api/**` and never looks at the app id.
      # The guard for a build must not be able to become the build.
      - name: Build the way the Base44 Builder does (no CI environment)
        run: env -u VITE_BASE44_APP_ID -u VITE_SITE_URL -u VERCEL -u CI npm run build -- --outDir dist-builder-check

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  # ── 2. Fast suites: unit, component, contract, integration, security ──────
  test-node:
    name: Unit, component, contract, integration, security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # The security suite runs `git ls-files`, so it needs the work tree.
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Pin npm (honours the .npmrc release cooldown)
        run: npm i -g npm@${{ env.NPM_VERSION }}

      - run: npm ci

      - name: Unit tests
        run: npm run test:unit

      - name: Component tests
        run: npm run test:component

      - name: Contract tests
        run: npm run test:contract

      # Runs the Base44 functions in-process against a recording client. They
      # are outside tsconfig and execute on Deno in production, so this is the
      # only place their behaviour — not their source — is checked.
      - name: Integration tests
        run: npm run test:integration

      - name: Static security tests
        run: npm run test:security

      # Prompt-adherence evals against the live agent. Every case is skipped
      # unless EVAL_BASE44_APP_ID and EVAL_BASE44_TOKEN are set, which CI does
      # not set: a completed interview would mail דורית and write a real lead.
      # The step runs so the suite stays compiled and its skip stays visible.
      - name: Agent evals (skipped without credentials)
        run: npm run test:eval

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-results
          path: test-results/
          retention-days: 7

      # The five suites above run in one job and append to a single
      # allure-results/, so this upload carries all of them. The name has to
      # match the `allure-results-*` pattern the publish job downloads, or the
      # report silently goes back to being e2e-only.
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-vitest
          path: allure-results/
          retention-days: 7

  # ── 3. How much e2e this run gets ────────────────────────────────────────
  #
  # The four platform legs are the whole cost of a run: 32 job-minutes, and a
  # wall clock set by the slowest of them. WebKit takes 9m against Chromium's
  # 4m for identical tests, and `ios-safari` is WebKit too — so two of the four
  # legs are more than twice the price of the other two.
  #
  # Paying that on every push to a feature branch buys very little: a defect
  # that only WebKit sees is rare, and when it happens the nightly run finds it
  # the same day. Paying it before a merge to main, and before a production
  # publish, buys a great deal.
  #
  #   feature branch, PR      →  Chromium only, about 5 minutes
  #   main, nightly, manual   →  all four platforms
  #
  # main is deliberately on the full matrix even though the request was for
  # feature branches and PRs: the publish job below refuses to run unless
  # test-e2e succeeded, so main's run is the gate in front of the client's
  # site. Narrowing it would quietly weaken that gate.
  #
  # ── Sharding ──────────────────────────────────────────────────────────────
  #
  # A leg is split across runners with `--shard=i/n`, each shard a job of its
  # own. This is the only lever that actually buys wall clock here, and it is
  # worth being precise about why the obvious one does not:
  #
  #   *More workers per runner does not work.* A standard runner has two cores,
  #   so a third and fourth browser do not get a core, they get a slice of one.
  #   Measured on 2026-09-13: four workers took web-webkit 9m22 → 11m52 and then
  #   failed. Re-measured on 2026-09-15 on a 12-core machine, where the excuse
  #   of too few cores does not apply, web-chromium ran 2 workers → 35.7s,
  #   4 → 23.0s, 6 → 23.6s, 8 → 25.1s, 10 → 31.8s, 12 → 34.2s. The curve turns
  #   upwards well before the core count: browsers are not CPU-bound here, and
  #   crowding them makes every one of them slower. See playwright.config.ts.
  #
  #   *More runners does work*, because each shard is two more real cores.
  #
  # Shards are bought where the time actually is. The WebKit legs are the wall
  # clock (9m22 and 8m15 against Chromium's 4m20), so they get three each and
  # the Chromium legs two. Every shard re-pays its own setup — checkout, npm ci,
  # the browser, the dist artifact, call it two minutes — so this trades total
  # job-minutes for wall clock, and the trade stops being worth it quickly:
  #
  #   web-webkit   9m22  ≈ 2m setup + 7m20 tests  →  3 shards ≈ 2m + 2m27 ≈ 4m30
  #   full matrix  10 jobs, ~9m22 wall → ~4m30 wall, ~32 → ~48 job-minutes
  #
  # Feature branches stay on a single Chromium shard. That path is already
  # ~5 minutes, over half of it setup, so a second shard would roughly double
  # its cost to save about a minute — on the event that fires most often.
  plan:
    name: Choose the e2e matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
      depth: ${{ steps.pick.outputs.depth }}
    steps:
      - name: Decide which platforms this run needs
        id: pick
        run: |
          # project:browser:shards — the shard count lives next to the platform
          # it pays for, so the two policies are read and changed together.
          full='web-chromium:chromium:2 web-webkit:webkit:3 ios-safari:webkit:3 android-chrome:chromium:2'
          quick='web-chromium:chromium:1'

          # Expanded to one matrix entry per shard. `shard` and `shards` stay
          # separate fields rather than a single "1/3": that string is fine for
          # --shard but illegal in an artifact name, and every shard uploads one.
          expand() {
            local entry project browser shards shard out=""
            for entry in $1; do
              IFS=: read -r project browser shards <<<"$entry"
              for shard in $(seq 1 "$shards"); do
                out="${out}{\"project\":\"$project\",\"browser\":\"$browser\",\"shard\":$shard,\"shards\":$shards},"
              done
            done
            echo "[${out%,}]"
          }

          case "${{ github.event_name }}:${{ github.ref }}" in
            schedule:*|workflow_dispatch:*|*:refs/heads/main|*:refs/heads/builder)
              echo "matrix=$(expand "$full")" >> "$GITHUB_OUTPUT"
              echo "depth=all four platforms, sharded across 10 runners" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "matrix=$(expand "$quick")" >> "$GITHUB_OUTPUT"
              echo "depth=Chromium only — the nightly run covers WebKit and mobile" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Say so in the run summary
        run: echo "**e2e depth:** ${{ steps.pick.outputs.depth }}" >> "$GITHUB_STEP_SUMMARY"

  # ── 3b. e2e: UI, API, security and accessibility, per platform shard ──────
  test-e2e:
    name: e2e (${{ matrix.project }} ${{ matrix.shard }}/${{ matrix.shards }})
    runs-on: ubuntu-latest
    needs: [build, plan]
    # Per shard, not per platform: a shard is a fraction of a leg, so 30 minutes
    # stopped being a timeout and became a licence. Ten covers the slowest leg
    # (9m22) even unsharded, which is the failure this is meant to catch.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Pin npm (honours the .npmrc release cooldown)
        run: npm i -g npm@${{ env.NPM_VERSION }}

      - run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('package-lock.json') }}

      # The cache above was being populated and then ignored: this step had no
      # `if`, so every job re-downloaded a browser it already had on disk. That
      # was a minute of waste per job when there were four; with ten shards it
      # is ten. On a hit only the OS packages are installed — those live outside
      # ~/.cache/ms-playwright and are not what the cache holds.
      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Install Playwright OS dependencies (browser came from cache)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps ${{ matrix.browser }}

      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # SKIP_BUILD: the dist/ artifact from the build job is what we test.
      #
      # --shard splits the leg by test, balanced by file, and Playwright makes
      # the split itself — the shards do not need to agree with each other about
      # anything beyond n. A single-shard leg (feature branches) passes 1/1,
      # which is a no-op.
      - name: Run e2e suite
        run: npx playwright test --project=${{ matrix.project }} --shard=${{ matrix.shard }}/${{ matrix.shards }}
        env:
          SKIP_BUILD: "1"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

      # Raw Allure results, kept per platform shard so the allure job can merge
      # every leg — plus the Vitest job's upload — into one report. Generating
      # per-leg would give a pile of partial reports instead of one picture of
      # the run, and sharding only makes that worse: the merge is what keeps a
      # three-way split of web-webkit readable as one platform.
      #
      # The name still matches the `allure-results-*` pattern the publish job
      # downloads, which is the only contract between the two jobs.
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.project }}-${{ matrix.shard }}
          path: allure-results/
          retention-days: 7

  # ── 4. Deploy (main only) ────────────────────────────────────────────────
  #
  # A red test run stops here and goes no further. `needs` without always()
  # means every one of these jobs must have *succeeded* — this is the gate that
  # keeps a known-broken build off the client's site, and it is deliberately
  # the strictest one in the file. Staging still deploys; see deploy-vercel.
  deploy:
    name: Publish to Base44
    outputs:
      published: ${{ steps.publish.outputs.published }}
      previous_asset: ${{ steps.before.outputs.asset }}
    runs-on: ubuntu-latest
    needs: [build, test-node, test-e2e]
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || inputs.deploy)
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Pin npm (honours the .npmrc release cooldown)
        run: npm i -g npm@${{ env.NPM_VERSION }}

      - run: npm ci

      # What production serves *now*, before anything replaces it. The smoke
      # job waits for this to change rather than assuming a returned CLI means
      # a served release — see scripts/wait-for-deployment.mjs.
      - name: Record the release production is serving
        id: before
        continue-on-error: true
        run: |
          asset=$(curl -fsSL --max-time 30 "${{ vars.PRODUCTION_URL }}" \
            | grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' | head -1 || true)
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
          echo "Production currently serves: ${asset:-unknown}"

      # Absent credentials skip the publish; *wrong* ones fail it.
      #
      # The CLI only treats BASE44_API_KEY as a key when it starts with `b44k_`:
      #
      #     function usingWorkspaceApiKey(): boolean {
      #       return process.env.BASE44_API_KEY?.trim().startsWith("b44k_") ?? false;
      #     }
      #
      # Any other value — a `B44U_` user token, say — is ignored, and the CLI
      # falls back to its device-code login. On a runner that is not an error
      # but a prompt nobody can answer: the step sat for five minutes and was
      # killed with an orphan node process, which says nothing about the cause.
      # One prefix check turns that into an instant, legible failure.
      # Two ways to authenticate, because only one of them exists on every plan.
      #
      #   1. BASE44_API_KEY — a *workspace* API key, `b44k_…`. Scoped to the
      #      workspace, does not expire, and the right answer. It needs the
      #      Business plan: below that the "Workspace API Keys" tab in the
      #      dashboard is greyed out and no such key can be created at all.
      #
      #   2. BASE44_ACCESS_TOKEN + BASE44_REFRESH_TOKEN — the pair a local
      #      `base44 login` leaves in ~/.base44/auth/auth.json. The CLI's
      #      `seedAuthFromEnv()` writes them into its own auth file at startup,
      #      which is the supported way to run it unattended without a
      #      workspace key. Both are required — it discards a session it has no
      #      way to refresh.
      #
      # The second is a wider credential than the first: it acts as the user,
      # across every app in the workspace, and it expires. When it does, this
      # step skips with a notice and production stays where it is.
      - name: Check publish credentials
        id: creds
        env:
          BASE44_API_KEY: ${{ secrets.BASE44_API_KEY }}
          BASE44_ACCESS_TOKEN: ${{ secrets.BASE44_ACCESS_TOKEN }}
          BASE44_REFRESH_TOKEN: ${{ secrets.BASE44_REFRESH_TOKEN }}
        run: |
          # Order matters, and it is "can we authenticate" rather than "is
          # every secret tidy". A leftover BASE44_API_KEY from before the
          # workspace-key tab turned out to need the Business plan must not
          # fail a run that has a perfectly good session to publish with — that
          # is what happened on the merge of #48, where all three secrets were
          # present and the stale one decided the outcome.
          #
          # Reaching the CLI with a non-`b44k_` key is harmless: every consumer
          # of it guards with `isWorkspaceApiKey()` first, so the value is inert
          # and the seeded session is used instead. The Publish step below
          # unsets it anyway, so that this stays true without depending on the
          # CLI's internals.
          if [ -z "${{ vars.BASE44_APP_ID }}" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::BASE44_APP_ID is unset — skipping the publish step. Production stays on whatever was last published by hand."
          elif [ -n "$BASE44_API_KEY" ] && [ "${BASE44_API_KEY#b44k_}" != "$BASE44_API_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Publishing with the workspace API key."
          elif [ -n "$BASE44_ACCESS_TOKEN" ] && [ -n "$BASE44_REFRESH_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Publishing with a seeded personal session. That credential expires — when this step starts skipping, re-seed it from ~/.base44/auth/auth.json."
            if [ -n "$BASE44_API_KEY" ]; then
              echo "::warning::BASE44_API_KEY is set but is not a workspace API key, so it is ignored. Delete the secret — a credential nobody uses is one nobody rotates."
            fi
          elif [ -n "$BASE44_API_KEY" ]; then
            # The original reason this check exists, and still the right answer
            # when it is the *only* credential: the CLI ignores a non-`b44k_`
            # value and falls back to an interactive device login, which on a
            # runner is a prompt nobody can answer. It hung for five minutes
            # and was killed with an orphan node process, saying nothing about
            # the cause. Failing instantly and legibly is better.
            echo "::error::BASE44_API_KEY is set but is not a workspace API key — those start with 'b44k_' — and there is no BASE44_ACCESS_TOKEN + BASE44_REFRESH_TOKEN pair to fall back on. The CLI would fall back to an interactive device login, which cannot be answered on a runner. Replace it with a workspace key, or set the token pair."
            exit 1
          elif [ -n "$BASE44_ACCESS_TOKEN" ]; then
            echo "::error::BASE44_ACCESS_TOKEN is set without BASE44_REFRESH_TOKEN. The CLI needs both and ignores a session it cannot refresh."
            exit 1
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Base44 credentials are configured — skipping the publish step. Production stays on whatever was last published by hand."
          fi

      # Three npm 12 defaults block this install: the CLI pulls `@deno/loader`
      # from a remote URL, refused as EALLOWREMOTE unless --allow-remote is
      # given, and the postinstalls for workerd and esbuild are skipped unless
      # they are named in --allow-scripts — the CLI needs both to bundle the
      # functions. All are scoped to this one global install, not to the repo's
      # dependencies.
      #
      # `base44 link` is not called. It existed to write the gitignored app-id
      # pointer, and its `--non-interactive` flag no longer exists — the CLI
      # dropped it, which is what broke this step. The app id travels in
      # BASE44_APP_ID, which the CLI reads directly, so there is nothing to link.
      #
      # `deploy` prompts twice without these flags — once to confirm and once
      # about building the site — and a prompt in CI is a hung job, not an
      # error.
      - name: Publish
        id: publish
        if: steps.creds.outputs.ready == 'true'
        env:
          BASE44_API_KEY: ${{ secrets.BASE44_API_KEY }}
          BASE44_ACCESS_TOKEN: ${{ secrets.BASE44_ACCESS_TOKEN }}
          BASE44_REFRESH_TOKEN: ${{ secrets.BASE44_REFRESH_TOKEN }}
          BASE44_APP_ID: ${{ vars.BASE44_APP_ID }}
        run: |
          # A key that is not a workspace key is not a credential, and passing
          # one leaves the CLI to decide what to do with it. It currently
          # ignores it — every read guards with `isWorkspaceApiKey()` — but the
          # step above has already chosen which credential to publish with, and
          # that choice should not depend on an implementation detail of a
          # package we install at `@latest`.
          if [ "${BASE44_API_KEY#b44k_}" = "$BASE44_API_KEY" ]; then
            unset BASE44_API_KEY
          fi
          npm install -g base44@latest --allow-remote=all --allow-scripts=workerd,esbuild
          base44 deploy --yes --build
          echo "published=true" >> "$GITHUB_OUTPUT"

  # ── 5. Deploy the built site to Vercel ───────────────────────────────────
  #
  # Staging deploys even when the tests are red — that is the point of it. A
  # failing run is exactly when you want the broken build somewhere you can
  # open, next to the Allure report that says what broke. The site is
  # login-protected, so nobody outside the team can reach it.
  #
  # Two things still stop it:
  #   - the build failing, since there would be nothing to deploy; asserted
  #     explicitly, because always() would otherwise run this job on a red
  #     build and fail confusingly inside `vercel build`
  #   - the run being cancelled — !cancelled() rather than always(), so a
  #     superseded push (concurrency cancels in-progress runs) does not race a
  #     deployment out of a half-finished run
  deploy-vercel:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: [build, test-node, test-e2e]
    outputs:
      url: ${{ steps.deploy.outputs.url }}
      deployed: ${{ steps.deploy.outputs.deployed }}
      kind: ${{ steps.target.outputs.kind }}
    # Also on `builder`, where it deploys a *preview* rather than production.
    # That is the point of the branch: a Builder edit gets a URL you can open
    # and look at before you merge it, instead of being judged from a diff.
    if: >-
      !cancelled() &&
      needs.build.result == 'success' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/builder') &&
      (github.event_name == 'push' || inputs.deploy)
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'vercel' || 'vercel-preview' }}
      url: ${{ steps.deploy.outputs.url }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Pin npm (honours the .npmrc release cooldown)
        run: npm i -g npm@${{ env.NPM_VERSION }}

      - run: npm ci

      - name: Check Vercel credentials
        id: creds
        run: |
          if [ -n "${{ secrets.VERCEL_TOKEN }}" ] && [ -n "${{ vars.VERCEL_SCOPE }}" ] && [ -n "${{ vars.VERCEL_PROJECT_NAME }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::VERCEL_TOKEN secret, or the VERCEL_SCOPE / VERCEL_PROJECT_NAME variables, are unset — skipping the Vercel deploy."
          fi

      # Confirm the token can actually see the project before doing any work.
      # The first run failed with "Could not retrieve Project Settings", which
      # is what a scope mismatch looks like — the ID env vars are only honoured
      # when the token's scope owns that project.
      - name: Verify the token reaches the project
        if: steps.creds.outputs.ready == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SCOPE: ${{ vars.VERCEL_SCOPE }}
        run: |
          who=$(npx vercel whoami --token "$VERCEL_TOKEN" 2>&1 | tail -1) || true
          echo "Token identity: $who"
          if ! npx vercel project ls --scope "$SCOPE" --token "$VERCEL_TOKEN" >/dev/null 2>&1; then
            echo "::error::VERCEL_TOKEN cannot list projects in scope '$SCOPE'. Recreate the token at https://vercel.com/account/tokens with that scope selected."
            exit 1
          fi

      # main deploys production; `builder` deploys a preview on its own URL.
      # One job rather than two: everything else about the two is identical,
      # and a second copy would drift from this one within a week.
      # Deploying on red is the point of staging; *promoting* on red is not.
      #
      # The job's own `if:` only requires `build` to have succeeded, which is
      # deliberate — a failing run is exactly when you want the thing somewhere
      # you can open it. But on `main` this step used to hand `--prod` to the
      # CLI regardless, and `needs:` does not gate, it only orders. That was
      # harmless while Vercel was staging behind a login. It stops being
      # harmless at README step 1: once the customer domain points here, and
      # with `vercel.json` disabling Git-triggered builds on `main` so CI is the
      # only promoter, a red push would land on customers.
      #
      # So a red run still deploys — as a preview, on its own URL, which is the
      # artefact you actually wanted. Only `--prod` waits for green.
      - name: Choose production or preview
        id: target
        env:
          UNIT: ${{ needs.test-node.result }}
          E2E: ${{ needs.test-e2e.result }}
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ] \
            && [ "$UNIT" = "success" ] && [ "$E2E" = "success" ]; then
            echo "prod=--prod" >> "$GITHUB_OUTPUT"
            echo "env=production" >> "$GITHUB_OUTPUT"
            echo "kind=production" >> "$GITHUB_OUTPUT"
          else
            if [ "$GITHUB_REF" = "refs/heads/main" ]; then
              echo "::warning::Tests are red (unit: ${UNIT}, e2e: ${E2E}) — deploying this as a preview instead of promoting it to production."
            fi
            echo "prod=" >> "$GITHUB_OUTPUT"
            echo "env=preview" >> "$GITHUB_OUTPUT"
            echo "kind=preview" >> "$GITHUB_OUTPUT"
          fi

      # Link by name and scope rather than by ID env vars. IDs only resolve when
      # the token's scope matches; the name+scope pair is unambiguous and gives
      # a readable error when it is not.
      - name: Build for Vercel
        if: steps.creds.outputs.ready == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SCOPE: ${{ vars.VERCEL_SCOPE }}
          PROJECT: ${{ vars.VERCEL_PROJECT_NAME }}
        run: |
          npx vercel link --yes --project "$PROJECT" --scope "$SCOPE" --token "$VERCEL_TOKEN"
          npx vercel pull --yes --environment=${{ steps.target.outputs.env }} --scope "$SCOPE" --token "$VERCEL_TOKEN"
          npx vercel build ${{ steps.target.outputs.prod }} --token "$VERCEL_TOKEN"

      - name: Deploy
        id: deploy
        if: steps.creds.outputs.ready == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SCOPE: ${{ vars.VERCEL_SCOPE }}
        run: |
          # npx can interleave notices on stdout, so take the last https line
          # rather than trusting the whole capture to be just the URL.
          #
          # --archive=tgz uploads one tarball instead of one request per file.
          # The free plan allows 5000 uploads per 24h, and this pipeline blew
          # through that in a day — mostly on the Allure report, which was
          # published here at the time and is thousands of small JSON files —
          # leaving deploys dead with "api-upload-free" until the window rolled
          # over. The report is not deployed anywhere at all now — it is a
          # single file attached to the run — but this flag stays: the budget
          # is per-account and a built site is plenty of files on its own.

          url=$(npx vercel deploy --prebuilt ${{ steps.target.outputs.prod }} --archive=tgz --scope "$SCOPE" --token "$VERCEL_TOKEN" \
                | grep -oE 'https://[^[:space:]]+' | tail -1)
          if [ -z "$url" ]; then
            echo "::error::Vercel deploy produced no URL"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "deployed=true" >> "$GITHUB_OUTPUT"
          echo "::notice::Deployed a ${{ steps.target.outputs.kind }} to $url"

      - name: Verify the deployment serves the app
        if: steps.creds.outputs.ready == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          # The project keeps Vercel Authentication on, so an anonymous curl is
          # answered with a 302 to a login page. `vercel curl` carries the
          # bypass, which is what makes this a real check rather than a ping.
          # No --token here: `vercel curl` forwards flags it does not recognise
          # to the real curl, which rejects --token. It authenticates from the
          # VERCEL_TOKEN environment variable instead, which this step sets.
          body=$(npx vercel curl "$URL/")
          echo "$body" | grep -q '<div id="root">' \
            || { echo "::error::Deployment did not serve the app shell"; exit 1; }
          echo "$body" | grep -q 'lang="he"' \
            || { echo "::error::Deployment did not serve the Hebrew RTL document"; exit 1; }

  # ── 6. Post-deploy smoke test against the live site ──────────────────────
  #
  # Waits on both publishes and smokes whatever `PRODUCTION_URL` names, rather
  # than assuming which host is the client-facing one. That assumption is about
  # to change: production moves from Base44 to Vercel with the custom domain, and
  # a smoke wired to one publisher would either stop running or keep testing the
  # host nobody visits any more. This way the cutover is a variable, not an edit.
  #
  # Check the publisher of PRODUCTION_URL before starting browsers. A successful
  # job can have skipped its publish step, and a staging deploy is not production.
  smoke:
    name: Production smoke test
    runs-on: ubuntu-latest
    needs: [deploy, deploy-vercel]
    if: >-
      !cancelled() &&
      github.ref == 'refs/heads/main' &&
      vars.PRODUCTION_URL != '' &&
      (needs.deploy.result == 'success' || needs['deploy-vercel'].result == 'success')
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Pin npm (honours the .npmrc release cooldown)
        run: npm i -g npm@${{ env.NPM_VERSION }}

      - name: Verify production was published by this run
        run: node scripts/check-production-publish.mjs
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
          BASE44_URL: ${{ vars.BASE44_URL }}
          BASE44_PUBLISHED: ${{ needs.deploy.outputs.published }}
          VERCEL_DEPLOYED: ${{ needs.deploy-vercel.outputs.deployed }}
          VERCEL_KIND: ${{ needs.deploy-vercel.outputs.kind }}

      # A publish that returned is not a release that is being served. Base44's
      # edge can keep handing out the previous bundle for minutes, and the smoke
      # then fails on whatever the new release added — which is exactly how
      # `#start` went red at publish time and green against the same URL later.
      - name: Wait for the new release to reach the edge
        run: node scripts/wait-for-deployment.mjs
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
          PREVIOUS_ASSET: ${{ needs.deploy.outputs.previous_asset }}

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # Against a real deployment the API/UI/a11y suites run untouched; the
      # security suite additionally enforces the transport hardening headers.
      - name: Smoke the deployment
        run: npx playwright test --project=web-chromium e2e/api e2e/ui/home.spec.ts e2e/a11y
        env:
          PLAYWRIGHT_BASE_URL: ${{ vars.PRODUCTION_URL }}
          E2E_ENFORCE_SECURITY_HEADERS: "0"

      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-smoke
          path: playwright-report/
          retention-days: 14

  # ── 7. Where the two sites live ──────────────────────────────────────────
  # Written to the run summary on every run, including when a deploy was
  # skipped, so the links are always one click from the Actions tab rather
  # than something you have to remember or dig out of a log.
  sites:
    name: Deployed sites
    runs-on: ubuntu-latest
    needs: [deploy-vercel, deploy, test-node, test-e2e, allure]
    # `main` only. On `builder` the URL is a preview of one change rather than
    # a site anyone lives on, and merge-readiness already reports it — two
    # tables calling the same URL different things is worse than one. On a
    # feature branch nothing is deployed at all, so the table would be three
    # rows of "not deployed" on every push.
    if: always() && github.ref == 'refs/heads/main'

    steps:
      - name: Write the site links to the run summary
        env:
          # Where the Base44 app lives, which stops being the same thing as where
          # customers go the moment the custom domain points at Vercel. They were one
          # variable until now because the two happened to coincide.
          BASE44_URL: ${{ vars.BASE44_URL }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
          VERCEL_URL: ${{ needs.deploy-vercel.outputs.url }}
          VERCEL_RESULT: ${{ needs.deploy-vercel.result }}
          BASE44_RESULT: ${{ needs.deploy.result }}
          BASE44_PUBLISHED: ${{ needs.deploy.outputs.published }}
          UNIT_RESULT: ${{ needs.test-node.result }}
          TESTS_RESULT: ${{ needs.test-e2e.result }}
          ALLURE_RESULT: ${{ needs.allure.result }}
          ALLURE_URL: ${{ needs.allure.outputs.url }}
          ALLURE_ALIAS: ${{ needs.allure.outputs.alias }}
          PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          vercel_link="${VERCEL_URL:-https://vercel.com/amielnoy-9725s-projects/dorit-finance-site}"

          # The permanent home of the test report: the `main` branch alias, which
          # always serves the newest report from the trunk. Derived from the same
          # variable the deploy uses rather than written out, so renaming the
          # Pages project cannot leave a dead link in the summary.
          ALLURE_HOME=""
          if [ -n "$PAGES_PROJECT" ]; then
            ALLURE_HOME="https://main.${PAGES_PROJECT}.pages.dev"
          fi

          # Did anything go red? That is what splits the two environments now:
          # staging takes the build either way, production does not.
          if [ "$UNIT_RESULT" = "success" ] && [ "$TESTS_RESULT" = "success" ]; then
            tests_green=true
          else
            tests_green=false
          fi

          case "$VERCEL_RESULT" in
            success)
              if [ -z "$VERCEL_URL" ]; then
                vercel_state="⏭️ not deployed — deployment credentials are missing"
              elif [ "$tests_green" = true ]; then
                vercel_state="✅ deployed this run"
              else
                vercel_state="⚠️ deployed with failing tests — staging deploys either way"
              fi ;;
            skipped)  vercel_state="⏭️ not deployed (this run was not a push to main)" ;;
            failure)  vercel_state="❌ deploy failed — the link is the previous deployment" ;;
            *)        vercel_state="⚠️ $VERCEL_RESULT" ;;
          esac

          case "$BASE44_RESULT" in
            success)
              if [ "$BASE44_PUBLISHED" = "true" ]; then
                base44_state="✅ published this run"
              else
                base44_state="⏭️ not published — publishing credentials are missing; production is unchanged"
              fi ;;
            failure)  base44_state="❌ publish failed" ;;
            skipped)
              if [ "$tests_green" = true ]; then
                base44_state="⏭️ not published (no credentials, or not a push to main)"
              else
                base44_state="🛑 held back — the tests were red"
              fi ;;
            *)        base44_state="⚠️ $BASE44_RESULT" ;;
          esac

          {
            echo "## Deployed sites"
            echo
            echo "| Environment | URL | This run |"
            echo "| --- | --- | --- |"
            echo "| **Base44** (app, backend functions, auth) | ${BASE44_URL:-https://safe-arch-plan.base44.app} | ${base44_state} |"
            echo "| **Vercel** (the built site) | ${vercel_link} | ${vercel_state} |"
            # Named rather than asserted. Which of the two above is client-facing is a
            # deployment decision that is in the middle of changing, and a hardcoded
            # label would have gone stale silently at exactly the wrong moment.
            if [ -n "$PRODUCTION_URL" ]; then
              echo "| **Production** (client-facing) | ${PRODUCTION_URL} | smoke-tested after every publish |"
            fi
            if [ -n "$ALLURE_URL" ]; then
              # The stable branch link in the URL column — it is the one to
              # bookmark — and this run's immutable copy beside it, since the
              # alias moves on to whatever deploys next.
              echo "| **Allure — test report** (Cloudflare, behind Access) | ${ALLURE_ALIAS:-$ALLURE_URL} | [deployed this run](${ALLURE_URL}) |"
            elif [ -n "$ALLURE_HOME" ]; then
              # This run published nothing — only `main`, `builder` and a manual
              # dispatch do. The hosted report still exists and is still the
              # place people look, so name it and say plainly that it is the
              # last `main` run rather than this one. A blank row here sent
              # people hunting for a URL that was up the whole time.
              if [ "$ALLURE_RESULT" = "success" ]; then
                echo "| **Allure — test report** (Cloudflare, behind Access) | ${ALLURE_HOME} | latest \`main\`; this run's copy is the [\`allure-report\` artifact](${RUN_URL}) |"
              else
                echo "| **Allure — test report** (Cloudflare, behind Access) | ${ALLURE_HOME} | latest \`main\`; this run built none (${ALLURE_RESULT}) |"
              fi
            elif [ "$ALLURE_RESULT" = "success" ]; then
              echo "| **Allure — test report** | [\`allure-report\` on this run](${RUN_URL}) | attached to this run |"
            else
              echo "| **Allure — test report** | — | not built (${ALLURE_RESULT}) |"
            fi
            echo
            echo "Unit suites: **${UNIT_RESULT}** · e2e across all four platforms: **${TESTS_RESULT}**"
            echo
            echo "> A red run still deploys to **staging** — the point is to be able to open the broken build"
            echo "> next to the report that says what broke. **Production is held back until the run is green.**"
            echo "> The Vercel staging link answers anonymous requests with a 302; sign in to Vercel to view it."
            echo ">"
            echo "> The test report also rides on this run as the \`allure-report\` artifact — one self-contained"
            echo "> \`index.html\`, no server needed. The Cloudflare copy sits behind Cloudflare Access, which CI"
            echo "> re-checks on every deploy: the repository is private and the report carries the client's copy."
          } >> "$GITHUB_STEP_SUMMARY"

  # ── 8. Attach the merged Allure report to the run ────────────────────────
  #
  # The report goes to two places, in two shapes, from one set of results:
  #
  #   - **This run**, as the `allure-report` artifact: one self-contained
  #     index.html that opens from the filesystem. Always produced, needs no
  #     credentials, and visible to exactly the people who can already see this
  #     private repository.
  #
  #   - **Cloudflare Pages**, as the ordinary multi-file report, when the
  #     credentials are set. Cloudflare refuses any single asset over 25 MiB
  #     and a full run's single-file report is ~46 MB, so the hosted copy has
  #     to be the split one (~4,000 files against a 20,000-file ceiling).
  #
  # The hosted copy must not be world-readable — it carries the client's copy
  # and screenshots of her site — so the deploy is followed by a step that
  # fetches it anonymously and fails if the report comes back. Cloudflare
  # Access is configured in the dashboard, not from here, and a protection
  # that nothing checks is a protection that silently lapses.
  allure:
    name: Build and deploy Allure report
    runs-on: ubuntu-latest
    # Both test jobs, or the report races the vitest artifact and publishes
    # without it.
    needs: [test-node, test-e2e]
    # always(): a failing run is exactly when the report is worth reading.
    # Builder runs publish it too: a red `builder` run is the one someone
    # actually has to read, and it is the only place that says why main did
    # not move.
    #
    # Every branch gets a report, because a feature branch is exactly where a
    # red run needs reading and the artifact costs nothing to produce. Only
    # `main` and `builder` publish it — see the deploy condition below.
    if: always()

    outputs:
      url: ${{ steps.cfdeploy.outputs.url }}
      alias: ${{ steps.cfdeploy.outputs.alias }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Pin npm (honours the .npmrc release cooldown)
        run: npm i -g npm@${{ env.NPM_VERSION }}

      - run: npm ci

      - name: Collect the results from every platform
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: allure-parts

      - name: Merge into one results directory
        run: |
          mkdir -p allure-results
          # Each artifact unpacks to its own directory; flatten them together.
          find allure-parts -type f -exec cp -n {} allure-results/ \; 2>/dev/null || true
          echo "merged $(ls allure-results | wc -l) result files"

      # History makes the trend graphs meaningful across runs; without it every
      # report claims to be the first one. Allure 3 reads and rewrites
      # `allure-history/history.jsonl` itself (`historyPath` in allurerc.mjs),
      # so restoring the cache is the whole mechanism — none of the copying in
      # and out of the report directory that Allure 2 needed.
      - name: Restore report history
        uses: actions/cache@v4
        with:
          path: allure-history
          key: allure-history-${{ github.run_id }}
          restore-keys: allure-history-

      # Also strips the Google Analytics beacon Allure injects into every
      # report — see scripts/strip-allure-analytics.mjs for why that is not
      # just a config flag.
      - name: Generate the report
        run: npm run allure:generate

      - name: Attach the report to this run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 14

      # Opt-in, like every other deploy here: no credentials, no deployment,
      # and the run still goes green with the report on it as an artifact.
      #
      # Restricted to the two long-lived branches. Every branch builds a report
      # — that is the artifact above — but a repository has one Pages site, and
      # letting every feature branch overwrite it would mean the URL shows
      # whichever branch pushed last rather than the state of the trunk.
      - name: Check Cloudflare credentials
        id: cf
        if: >-
          github.ref == 'refs/heads/main' ||
          github.ref == 'refs/heads/builder' ||
          github.event_name == 'workflow_dispatch'
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ] && [ -n "$PROJECT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets or the CLOUDFLARE_PAGES_PROJECT variable are unset — the report is attached to this run and was not deployed."
          fi

      # The split report, for Cloudflare's 25 MiB-per-asset limit. Same results,
      # same analytics strip — see allurerc.mjs.
      - name: Build the hosted copy
        if: steps.cf.outputs.ready == 'true'
        run: npm run allure:generate:site

      # Idempotent, and the `--production-branch` is the point of it: set to a
      # name this pipeline never pushes, so every deploy below is a *preview*
      # deployment. That is the only kind Cloudflare's one-click access policy
      # protects — the toggle does not cover the production domain. A failure
      # here usually just means the project already exists, so it is not fatal;
      # the deploy step is the real check.
      - name: Ensure the Pages project exists
        if: steps.cf.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          if npx wrangler pages project create "$PROJECT" --production-branch production >/dev/null 2>&1; then
            echo "::notice::Created Cloudflare Pages project '$PROJECT' with production branch 'production', so CI deploys land as preview deployments."
          else
            echo "Project '$PROJECT' already exists, or could not be created — the deploy step will say which."
          fi


      # --branch is the git ref, never Cloudflare's configured production
      # branch: that makes every one of these a *preview* deployment, which is
      # the only thing the project's one-click "Enable access policy" toggle
      # protects. Cloudflare's own docs are explicit that the toggle does not
      # cover the `*.pages.dev` production domain or a custom domain — those
      # need an Access application in Zero Trust covering the hostname.
      - name: Deploy to Cloudflare Pages
        id: cfdeploy
        if: steps.cf.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          # Keep wrangler's own output in the log — piping it straight into
          # grep meant a failed deploy showed nothing but "produced no URL".
          out=$(npx wrangler pages deploy allure-report-site \
                  --project-name "$PROJECT" \
                  --branch "$GITHUB_REF_NAME" \
                  --commit-hash "$GITHUB_SHA" \
                  --commit-dirty=true 2>&1)
          echo "$out"

          # Two URLs, and which one belongs in a summary differs:
          #
          #   url   — `<hash>.<project>.pages.dev`, immutable, this run's copy.
          #   alias — `<branch>.<project>.pages.dev`, stable, always the latest
          #           deploy of the branch. This is the one worth bookmarking.
          #
          # Both are preview deployments, so both sit behind the access policy.
          # The bare `<project>.pages.dev` is neither: it is the production
          # domain, which this pipeline never deploys to and which the toggle
          # does not cover — publishing it would hand out a dead link that is
          # also the one hostname with nothing in front of it.
          url=$(printf '%s\n' "$out" | grep -vi alias | grep -oE 'https://[^[:space:]]+\.pages\.dev' | tail -1)
          alias=$(printf '%s\n' "$out" | grep -i alias | grep -oE 'https://[^[:space:]]+\.pages\.dev' | tail -1)
          if [ -z "$url" ]; then
            echo "::error::wrangler produced no deployment URL"
            exit 1
          fi
          # wrangler has not always printed the alias line. Derive it rather
          # than drop the stable link from the summary when it doesn't:
          # Cloudflare lowercases the branch, replaces anything not
          # alphanumeric with a hyphen, and truncates.
          if [ -z "$alias" ]; then
            slug=$(printf '%s' "$GITHUB_REF_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g' | cut -c1-28 | sed 's/-*$//')
            alias="https://${slug}.${PROJECT}.pages.dev"
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "alias=$alias" >> "$GITHUB_OUTPUT"
          echo "::notice::Allure report deployed to $alias (this run's copy: $url)"

      # The requirement is that it is not world-readable, so assert it rather
      # than assume the dashboard is still set the way someone left it. Access
      # answers an anonymous request with its own login page, so a 200 alone
      # proves nothing — what must not come back is the report itself.
      - name: Verify the report is not world-readable
        if: steps.cf.outputs.ready == 'true'
        env:
          URL: ${{ steps.cfdeploy.outputs.url }}
          ALIAS: ${{ steps.cfdeploy.outputs.alias }}
        run: |
          # Both hostnames, because both are published in the run summary and
          # Access is applied per hostname. Checking only the one nobody opens
          # is how a protection lapses without anyone noticing.
          for target in "$URL" "$ALIAS"; do
            [ -n "$target" ] || continue
            code=$(curl -sL -o anon.html -w '%{http_code}' "$target/" || echo 000)
            if grep -qi 'allure\|Dorit Gov-Ari' anon.html 2>/dev/null; then
              echo "::error::${target} served the report to an anonymous request (HTTP ${code}). Cloudflare Access is not in front of it. Enable the project's access policy (Workers & Pages → the project → Settings → General → Enable access policy), or add a Zero Trust Access application covering this hostname, then re-run."
              exit 1
            fi
            echo "::notice::${target} answered an anonymous request with HTTP ${code} and no report content — Access is in front of it."
          done




  # ── 9. Is this safe to merge? ────────────────────────────────────────────
  #
  # This job was gated to `builder` and skipped everywhere else, which meant the
  # check named "Safe to merge?" never produced a verdict on the branches people
  # actually open pull requests from. A green PR showed no verdict, no preview
  # link and no report link — the one question the job exists to answer went
  # unanswered on every PR. It now runs on every branch except `main`, where
  # there is nothing left to merge and the "Deployed sites" table says more.
  #
  # CI reports; it does not merge. On a Builder branch that is because Base44
  # owns promotion — the Builder replaces its Publish button with "Merge to
  # main", and it keeps each Builder branch as a real branch here, so a CI job
  # that merged would race it and leave the two disagreeing about what happened.
  # On an ordinary PR it is because nobody asked for an unattended merge. Either
  # way the enforcement that matters is downstream: publishing happens only from
  # main, and the publish job there demands a green run.
  #
  # The verdict goes two places. The run summary, as before, and — when the
  # commit has an open PR — a comment on it, edited in place so there is one
  # comment that is always about the latest run rather than a pile of stale
  # ones. That matters more than usual here: `pull_request` fires only on
  # `opened`/`reopened` (see the trigger), so most runs on a PR arrive as pushes
  # and a create-only comment would freeze at whatever the first run said.
  #
  # And it fails when the answer is no. A check called "Safe to merge?" sitting
  # green next to a body that says "do not merge" is worse than no check at all.
  # Nothing depends on this job, so the failure costs nothing but the red mark
  # it is there to give.
  merge-readiness:
    name: Safe to merge?
    runs-on: ubuntu-latest
    needs: [build, test-node, test-e2e, deploy-vercel, allure]
    # `!cancelled()` rather than `always()`. `always()` includes cancellation,
    # and this workflow sets `cancel-in-progress: true` — so pushing twice in
    # quick succession cancelled run #1, whose verdict job still ran, read
    # `E2E == 'cancelled'`, overwrote the PR's one edited comment with "do not
    # merge" and failed the check. A superseded run has no opinion worth
    # posting; the run that replaced it does.
    if: ${{ !cancelled() && github.ref != 'refs/heads/main' }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Compose the verdict
        id: verdict
        env:
          BUILD: ${{ needs.build.result }}
          UNIT: ${{ needs.test-node.result }}
          E2E: ${{ needs.test-e2e.result }}
          PREVIEW_URL: ${{ needs.deploy-vercel.outputs.url }}
          ALLURE_RESULT: ${{ needs.allure.result }}
          ALLURE_URL: ${{ needs.allure.outputs.url }}
          ALLURE_ALIAS: ${{ needs.allure.outputs.alias }}
          PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          IS_BUILDER: ${{ github.ref == 'refs/heads/builder' || github.head_ref == 'builder' }}
        run: |
          # The report's permanent home — the `main` alias, newest trunk report.
          # This job runs on every branch but `main`, and a feature branch never
          # publishes, so without this the verdict mentioned no hosted report at
          # all and the URL looked like it did not exist.
          ALLURE_HOME=""
          if [ -n "$PAGES_PROJECT" ]; then
            ALLURE_HOME="https://main.${PAGES_PROJECT}.pages.dev"
          fi

          if [ "$BUILD" = "success" ] && [ "$UNIT" = "success" ] && [ "$E2E" = "success" ]; then
            green=true
            verdict="## ✅ Safe to merge"
            if [ "$IS_BUILDER" = "true" ]; then
              advice="Everything passed. Press **Merge to main** in the Builder; the publish from main is gated on a green run there too."
            else
              advice="Everything passed. The publish from main is gated on a green run there too, so merging is the last judgement call."
            fi
          else
            green=false
            verdict="## 🛑 Do not merge yet"
            if [ "$IS_BUILDER" = "true" ]; then
              advice="Something is red. Open the report below, fix it in the Builder, and push again — merging now would put this on main."
            else
              advice="Something is red. Open the report below and fix it on this branch — merging now would put it on main."
            fi
          fi
          echo "green=$green" >> "$GITHUB_OUTPUT"

          {
            echo "$verdict"
            echo
            echo "$advice"
            echo
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Build · lint · typecheck | ${BUILD} |"
            echo "| Unit · component · contract · security | ${UNIT} |"
            echo "| e2e across four platforms | ${E2E} |"
            echo
            if [ -n "$PREVIEW_URL" ]; then
              echo "**Preview of this change:** ${PREVIEW_URL}"
              echo
              echo "> Sign in to Vercel to open it — previews answer anonymous requests with a 302."
            else
              echo "_No preview was deployed for this run._"
            fi
            echo
            if [ -n "$ALLURE_URL" ]; then
              echo "**Test report:** ${ALLURE_ALIAS:-$ALLURE_URL} (sign in through Cloudflare Access)"
              echo "— [this run's copy](${ALLURE_URL}) if the branch has moved on since — or the"
              echo "\`allure-report\` artifact on [this run](${RUN_URL})."
            elif [ -n "$ALLURE_HOME" ] && [ "$ALLURE_RESULT" = "success" ]; then
              echo "**Test report:** this run's is the \`allure-report\` artifact on"
              echo "[this run](${RUN_URL}) — one self-contained \`index.html\`, no server needed."
              echo
              echo "The hosted report lives at ${ALLURE_HOME} (sign in through Cloudflare"
              echo "Access). It shows the latest **\`main\`** run, not this branch: only \`main\`,"
              echo "\`builder\` and a manual dispatch publish there."
            elif [ "$ALLURE_RESULT" = "success" ]; then
              echo "**Test report:** the \`allure-report\` artifact on [this run](${RUN_URL}) — one self-contained"
              echo "\`index.html\`; unzip and open it, no server needed."
            else
              echo "_Test report: not built (${ALLURE_RESULT})._"
            fi
            echo
            if [ "$IS_BUILDER" = "true" ]; then
              echo "> Heads-up: every Builder branch shares the app's **live data**. The tests never"
              echo "> touch it, but anything you do by hand in the Builder writes to real records."
              echo
            fi
            echo "<sub>[This run](${RUN_URL}) · re-runs replace this comment rather than adding one.</sub>"
          } > verdict.md

      - name: Write it to the run summary
        run: cat verdict.md >> "$GITHUB_STEP_SUMMARY"

      # Only if the commit has an open PR. A push to a branch with no PR yet
      # still gets the run summary above, so nothing is lost by staying quiet
      # here — and `gh pr list` is what makes this work on a push event, where
      # there is no PR context in the payload at all.
      #
      # Never fatal. This step reports; the verdict itself is already in the run
      # summary and the step below is what colours the check. A posting failure
      # is an infrastructure problem, and failing here would turn every PR red
      # for a reason that has nothing to do with the code under test — while
      # saying nothing about why.
      #
      # The likely reason is named explicitly because it is invisible from the
      # log otherwise: this repository's default workflow permissions are
      # read-only (Settings → Actions → General → Workflow permissions). The
      # job-level `permissions:` block above asks for `pull-requests: write`;
      # if that setting caps it, the API answers 403 and the comment silently
      # never appears — which is exactly the symptom this job was fixed to cure.
      - name: Post it on the pull request, if there is one
        env:
          GH_TOKEN: ${{ github.token }}
          PR_FROM_EVENT: ${{ github.event.pull_request.number }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          pr="$PR_FROM_EVENT"
          if [ -z "$pr" ]; then
            pr=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty') || true
          fi
          if [ -z "$pr" ]; then
            echo "::notice::No open PR for ${BRANCH} — the verdict is in the run summary only."
            exit 0
          fi
          # --edit-last keeps one comment per PR. It errors when there is no
          # previous one, hence the fallback rather than a version-dependent
          # --create-if-none.
          if gh pr comment "$pr" --edit-last --body-file verdict.md \
            || gh pr comment "$pr" --body-file verdict.md; then
            echo "::notice::Verdict posted on PR #${pr}."
          else
            echo "::warning::Could not comment on PR #${pr}. The verdict is in the run summary. If this is a 403, set Settings → Actions → General → Workflow permissions to 'Read and write permissions' — this repository is currently on read-only, which caps the pull-requests: write this job asks for."
          fi

      # Last, so the verdict is published either way before this decides the
      # colour of the check.
      - name: Fail if the answer is no
        if: steps.verdict.outputs.green != 'true'
        run: |
          echo "::error::Not safe to merge — see the verdict on the PR and in the run summary."
          exit 1

  # ── The daily log archive ──────────────────────────────────────────────────
  #
  # Base44 keeps function logs and serves them through `base44 logs`, but not
  # forever, and only through a CLI that needs a workspace key. That is fine for
  # "what happened in the last hour" and useless for "what changed between last
  # Tuesday and today" — which is the question that actually gets asked after a
  # complaint about a lead that never arrived.
  #
  # So once a day the previous 24 hours are fetched and kept as an artifact.
  # They are deliberately *not* committed: this repository is public, and the
  # lines — timings, volumes, escalation reasons for a real agency — are not
  # something to publish, even though they carry no personal data by design.
  # An artifact is visible to collaborators and expires on its own, which is the
  # right shape for an operational record.
  logs:
    name: Archive yesterday's logs
    runs-on: ubuntu-latest
    # Only the nightly run. A push has nothing new to archive, and archiving on
    # every branch push would spend the private-repo minutes on duplicates.
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Either credential path, exactly as the publish job accepts them.
      - name: Check credentials
        id: creds
        env:
          BASE44_API_KEY: ${{ secrets.BASE44_API_KEY }}
          BASE44_ACCESS_TOKEN: ${{ secrets.BASE44_ACCESS_TOKEN }}
          BASE44_REFRESH_TOKEN: ${{ secrets.BASE44_REFRESH_TOKEN }}
        run: |
          # Same precedence as the publish job: a usable credential wins over a
          # stale one sitting beside it. Nothing here ever fails the run — an
          # unarchived day is a gap in an operational record, not a broken
          # build, and a nightly job that reddens the badge is a job everyone
          # learns to ignore.
          if [ -z "${{ vars.BASE44_APP_ID }}" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::BASE44_APP_ID is unset — no logs were archived."
          elif [ -n "$BASE44_API_KEY" ] && [ "${BASE44_API_KEY#b44k_}" != "$BASE44_API_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$BASE44_ACCESS_TOKEN" ] && [ -n "$BASE44_REFRESH_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Base44 credentials — no logs were archived. Yesterday's lines stay only in Base44's own retention."
          fi

      - name: Install the CLI
        if: steps.creds.outputs.ready == 'true'
        run: npm ci --ignore-scripts

      - name: Fetch the last 24 hours
        if: steps.creds.outputs.ready == 'true'
        env:
          BASE44_API_KEY: ${{ secrets.BASE44_API_KEY }}
          BASE44_ACCESS_TOKEN: ${{ secrets.BASE44_ACCESS_TOKEN }}
          BASE44_REFRESH_TOKEN: ${{ secrets.BASE44_REFRESH_TOKEN }}
          BASE44_APP_ID: ${{ vars.BASE44_APP_ID }}
        run: |
          if [ "${BASE44_API_KEY#b44k_}" = "$BASE44_API_KEY" ]; then
            unset BASE44_API_KEY
          fi
          npm run logs:archive

      - name: Keep them
        if: steps.creds.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.run_id }}
          path: logs/
          # Long enough to answer "what happened last quarter", short enough
          # that an operational record does not become an archive nobody
          # decided to keep.
          retention-days: 90
          if-no-files-found: warn
