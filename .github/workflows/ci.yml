# CI/CD — install → build → test → deploy.
#
# Deploy note: this repo syncs to Base44 through git (see README), so pushing to
# `main` is what reaches the platform; the workflow's deploy job publishes that
# synced state and then smoke-tests the live site. The publish step is opt-in —
# it runs only when the BASE44_TOKEN secret and BASE44_APP_ID variable are set,
# so a fork or a fresh clone gets a green CI without any credentials.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Publish to Base44 after the tests pass"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  # .npmrc sets `min-release-age=7`, a supply-chain cooldown that only npm >= 12
  # understands. On the npm bundled with Node 22 the setting is ignored, so CI
  # would resolve versions newer than the lockfile — `npm ci` then fails as
  # out of sync, and any install would silently skip the cooldown the policy
  # exists to enforce. Pin the client that honours it.
  NPM_VERSION: "12"
  VITE_BASE44_APP_ID: e2e-sanity-app

jobs:
  # ── 1. Install + static checks + build ────────────────────────────────────
  build:
    name: Install, lint, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Pin npm (honours the .npmrc release cooldown)
        run: npm i -g npm@${{ env.NPM_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Non-blocking: `tsc` reports ~74 errors inherited from the JS→TS
      # conversion (untyped shadcn wrappers, lucide icon prop variance). They
      # are surfaced on every run; drop continue-on-error once they are fixed.
      - name: Typecheck (known pre-existing failures)
        run: npm run typecheck
        continue-on-error: true

      - name: Build
        run: npm run build

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  # ── 2. Fast suites: unit, component, contract, static security ────────────
  test-node:
    name: Unit, component, contract, security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # The security suite runs `git ls-files`, so it needs the work tree.
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Pin npm (honours the .npmrc release cooldown)
        run: npm i -g npm@${{ env.NPM_VERSION }}

      - run: npm ci

      - name: Unit tests
        run: npm run test:unit

      - name: Component tests
        run: npm run test:component

      - name: Contract tests
        run: npm run test:contract

      - name: Static security tests
        run: npm run test:security

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-results
          path: test-results/
          retention-days: 7

  # ── 3. e2e: UI, API, security and accessibility, per platform ─────────────
  test-e2e:
    name: e2e (${{ matrix.project }})
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: web-chromium
            browser: chromium
          - project: web-webkit
            browser: webkit
          - project: ios-safari
            browser: webkit
          - project: android-chrome
            browser: chromium
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Pin npm (honours the .npmrc release cooldown)
        run: npm i -g npm@${{ env.NPM_VERSION }}

      - run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browser
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # SKIP_BUILD: the dist/ artifact from the build job is what we test.
      - name: Run e2e suite
        run: npx playwright test --project=${{ matrix.project }}
        env:
          SKIP_BUILD: "1"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

      # Raw Allure results, kept per platform so the allure job can merge all
      # five legs into one report. Generating per-leg would give five partial
      # reports instead of one picture of the run.
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.project }}
          path: allure-results/
          retention-days: 7

  # ── 4. Deploy (main only) ────────────────────────────────────────────────
  deploy:
    name: Publish to Base44
    runs-on: ubuntu-latest
    needs: [build, test-node, test-e2e]
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || inputs.deploy)
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Pin npm (honours the .npmrc release cooldown)
        run: npm i -g npm@${{ env.NPM_VERSION }}

      - run: npm ci

      - name: Check publish credentials
        id: creds
        run: |
          if [ -n "${{ secrets.BASE44_TOKEN }}" ] && [ -n "${{ vars.BASE44_APP_ID }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::BASE44_TOKEN secret or BASE44_APP_ID variable is unset — skipping the publish step. The git sync to Base44 still happened on push."
          fi

      - name: Publish
        if: steps.creds.outputs.ready == 'true'
        env:
          BASE44_TOKEN: ${{ secrets.BASE44_TOKEN }}
          BASE44_APP_ID: ${{ vars.BASE44_APP_ID }}
        run: |
          npm install -g base44@latest
          base44 link --app-id "$BASE44_APP_ID" --non-interactive
          base44 deploy

  # ── 5. Deploy the built site to Vercel ───────────────────────────────────
  deploy-vercel:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: [build, test-node, test-e2e]
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || inputs.deploy)
    environment:
      name: vercel
      url: ${{ steps.deploy.outputs.url }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Pin npm (honours the .npmrc release cooldown)
        run: npm i -g npm@${{ env.NPM_VERSION }}

      - run: npm ci

      - name: Check Vercel credentials
        id: creds
        run: |
          if [ -n "${{ secrets.VERCEL_TOKEN }}" ] && [ -n "${{ vars.VERCEL_SCOPE }}" ] && [ -n "${{ vars.VERCEL_PROJECT_NAME }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::VERCEL_TOKEN secret, or the VERCEL_SCOPE / VERCEL_PROJECT_NAME variables, are unset — skipping the Vercel deploy."
          fi

      # Confirm the token can actually see the project before doing any work.
      # The first run failed with "Could not retrieve Project Settings", which
      # is what a scope mismatch looks like — the ID env vars are only honoured
      # when the token's scope owns that project.
      - name: Verify the token reaches the project
        if: steps.creds.outputs.ready == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SCOPE: ${{ vars.VERCEL_SCOPE }}
        run: |
          who=$(npx vercel whoami --token "$VERCEL_TOKEN" 2>&1 | tail -1) || true
          echo "Token identity: $who"
          if ! npx vercel project ls --scope "$SCOPE" --token "$VERCEL_TOKEN" >/dev/null 2>&1; then
            echo "::error::VERCEL_TOKEN cannot list projects in scope '$SCOPE'. Recreate the token at https://vercel.com/account/tokens with that scope selected."
            exit 1
          fi

      # Link by name and scope rather than by ID env vars. IDs only resolve when
      # the token's scope matches; the name+scope pair is unambiguous and gives
      # a readable error when it is not.
      - name: Build for Vercel
        if: steps.creds.outputs.ready == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SCOPE: ${{ vars.VERCEL_SCOPE }}
          PROJECT: ${{ vars.VERCEL_PROJECT_NAME }}
        run: |
          npx vercel link --yes --project "$PROJECT" --scope "$SCOPE" --token "$VERCEL_TOKEN"
          npx vercel pull --yes --environment=production --scope "$SCOPE" --token "$VERCEL_TOKEN"
          npx vercel build --prod --token "$VERCEL_TOKEN"

      - name: Deploy
        id: deploy
        if: steps.creds.outputs.ready == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SCOPE: ${{ vars.VERCEL_SCOPE }}
        run: |
          # npx can interleave notices on stdout, so take the last https line
          # rather than trusting the whole capture to be just the URL.
          url=$(npx vercel deploy --prebuilt --prod --scope "$SCOPE" --token "$VERCEL_TOKEN" \
                | grep -oE 'https://[^[:space:]]+' | tail -1)
          if [ -z "$url" ]; then
            echo "::error::Vercel deploy produced no URL"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "::notice::Deployed to $url"

      - name: Verify the deployment serves the app
        if: steps.creds.outputs.ready == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          # The project keeps Vercel Authentication on, so an anonymous curl is
          # answered with a 302 to a login page. `vercel curl` carries the
          # bypass, which is what makes this a real check rather than a ping.
          # No --token here: `vercel curl` forwards flags it does not recognise
          # to the real curl, which rejects --token. It authenticates from the
          # VERCEL_TOKEN environment variable instead, which this step sets.
          body=$(npx vercel curl "$URL/")
          echo "$body" | grep -q '<div id="root">' \
            || { echo "::error::Deployment did not serve the app shell"; exit 1; }
          echo "$body" | grep -q 'lang="he"' \
            || { echo "::error::Deployment did not serve the Hebrew RTL document"; exit 1; }

  # ── 6. Post-deploy smoke test against the live site ──────────────────────
  smoke:
    name: Production smoke test
    runs-on: ubuntu-latest
    needs: deploy
    if: ${{ needs.deploy.result == 'success' && vars.PRODUCTION_URL != '' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Pin npm (honours the .npmrc release cooldown)
        run: npm i -g npm@${{ env.NPM_VERSION }}

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # Against a real deployment the API/UI/a11y suites run untouched; the
      # security suite additionally enforces the transport hardening headers.
      - name: Smoke the deployment
        run: npx playwright test --project=web-chromium e2e/api e2e/ui/home.spec.ts e2e/a11y
        env:
          PLAYWRIGHT_BASE_URL: ${{ vars.PRODUCTION_URL }}
          E2E_ENFORCE_SECURITY_HEADERS: "0"

      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-smoke
          path: playwright-report/
          retention-days: 14

  # ── 7. Where the two sites live ──────────────────────────────────────────
  # Written to the run summary on every run, including when a deploy was
  # skipped, so the links are always one click from the Actions tab rather
  # than something you have to remember or dig out of a log.
  sites:
    name: Deployed sites
    runs-on: ubuntu-latest
    needs: [deploy-vercel, test-e2e, allure]
    if: always()
    steps:
      - name: Write the site links to the run summary
        env:
          BASE44_URL: ${{ vars.PRODUCTION_URL }}
          VERCEL_URL: ${{ needs.deploy-vercel.outputs.url }}
          VERCEL_RESULT: ${{ needs.deploy-vercel.result }}
          TESTS_RESULT: ${{ needs.test-e2e.result }}
          ALLURE_URL: ${{ needs.allure.outputs.url }}
        run: |
          vercel_link="${VERCEL_URL:-https://vercel.com/amielnoy-9725s-projects/dorit-finance-site}"

          case "$VERCEL_RESULT" in
            success)  vercel_state="✅ deployed this run" ;;
            skipped)  vercel_state="⏭️ not deployed (this run was not a push to main)" ;;
            failure)  vercel_state="❌ deploy failed — the link is the previous deployment" ;;
            *)        vercel_state="⚠️ $VERCEL_RESULT" ;;
          esac

          {
            echo "## Deployed sites"
            echo
            echo "| Environment | URL | This run |"
            echo "| --- | --- | --- |"
            echo "| **Base44 — production** (client-facing) | ${BASE44_URL:-https://safe-arch-plan.base44.app} | not deployed by CI — see note |"
            echo "| **Vercel — staging** (login-protected) | ${vercel_link} | ${vercel_state} |"
            if [ -n "$ALLURE_URL" ]; then
              echo "| **Allure — test report** | ${ALLURE_URL} | published this run |"
            else
              echo "| **Allure — test report** | downloadable from this run's artifacts | not published |"
            fi
            echo
            echo "Tests across all five platforms: **${TESTS_RESULT}**"
            echo
            echo "> Base44 is published with \`base44 deploy\` from a clean checkout of \`main\`, not by this pipeline —"
            echo "> its GitHub connection is broken, so it cannot pull the merged code itself."
            echo "> The Vercel staging link answers anonymous requests with a 302; sign in to Vercel to view it."
          } >> "$GITHUB_STEP_SUMMARY"

  # ── 8. Publish the merged Allure report ──────────────────────────────────
  allure:
    name: Publish Allure report
    runs-on: ubuntu-latest
    needs: test-e2e
    # always(): a failing run is exactly when the report is worth reading.
    if: always() && github.ref == 'refs/heads/main'
    outputs:
      url: ${{ steps.publish.outputs.url }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Pin npm (honours the .npmrc release cooldown)
        run: npm i -g npm@${{ env.NPM_VERSION }}

      - run: npm ci

      - name: Collect the results from every platform
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: allure-parts

      - name: Merge into one results directory
        run: |
          mkdir -p allure-results
          # Each artifact unpacks to its own directory; flatten them together.
          find allure-parts -type f -exec cp -n {} allure-results/ \; 2>/dev/null || true
          echo "merged $(ls allure-results | wc -l) result files"

      # History makes the trend graphs meaningful across runs. Without it every
      # report claims to be the first one.
      - name: Restore report history
        uses: actions/cache@v4
        with:
          path: allure-history
          key: allure-history-${{ github.run_id }}
          restore-keys: allure-history-

      - name: Carry history into this run
        run: |
          if [ -d allure-history ]; then cp -r allure-history allure-results/history || true; fi

      - name: Generate the report
        run: |
          npx allure generate allure-results --clean -o allure-report
          cp -r allure-report/history allure-history 2>/dev/null || true

      - name: Publish to Vercel
        id: publish
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SCOPE: ${{ vars.VERCEL_SCOPE }}
          PROJECT: ${{ vars.VERCEL_REPORT_PROJECT }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$PROJECT" ]; then
            echo "::notice::VERCEL_TOKEN or VERCEL_REPORT_PROJECT unset — report generated but not published."
            exit 0
          fi
          cd allure-report
          # A static export: no build step, no rewrites. Allure routes on the
          # hash, so index.html serves every view already.
          printf '{ "cleanUrls": false, "trailingSlash": false }' > vercel.json
          url=$(npx vercel deploy --prod --yes \
                  --name "$PROJECT" --scope "$SCOPE" --token "$VERCEL_TOKEN" \
                | grep -oE 'https://[^[:space:]]+' | tail -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "::notice::Allure report: $url"

      - name: Keep the report as an artifact too
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 14
