<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Local Test Runner</title>
<style>
  :root {
    --bg: #10141d;
    --panel: #161c28;
    --panel-2: #1c2433;
    --border: #2a3242;
    --ink: #ccd4e3;
    --ink-strong: #eef2f8;
    --muted: #7d879a;
    --accent: #7c8cff;
    --pass: #34d399;
    --fail: #f87171;
    --broken: #fb923c;
    --skip: #94a3b8;
    --run: #fbbf24;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    margin: 0;
    min-height: 100vh;
    color: var(--ink);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background:
      radial-gradient(1100px 560px at 15% -12%, #283350 0%, transparent 60%),
      radial-gradient(900px 500px at 100% 0%, #241f3f 0%, transparent 55%),
      linear-gradient(180deg, #171e2c 0%, var(--bg) 100%);
    background-attachment: fixed;
  }
  .page { max-width: 1400px; margin: 0 auto; padding: 24px; }
  header { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 20px; }
  h1 { margin: 0; font-size: 22px; color: var(--ink-strong); letter-spacing: -0.01em; }
  h1 span { color: var(--accent); }
  h2 { margin: 0 0 12px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
  .subtitle { margin: 2px 0 0; font-size: 12px; color: var(--muted); }
  .card { background: color-mix(in srgb, var(--panel) 92%, transparent); border: 1px solid var(--border); border-radius: 16px; padding: 18px 20px; box-shadow: 0 10px 30px rgb(0 0 0 / 0.3); margin-bottom: 16px; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--border); background: var(--panel-2); font-size: 12px; color: var(--muted); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .pulse { animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.35; } }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--panel-2); color: var(--ink); cursor: pointer; user-select: none; transition: border-color 0.15s, background 0.15s; }
  .chip input { display: none; }
  .chip:has(input:checked) { border-color: var(--suite); background: color-mix(in srgb, var(--suite) 16%, var(--panel-2)); color: var(--ink-strong); }
  .chip .dot { color: var(--suite); }
  .controls { display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: end; margin-top: 16px; }
  .field { display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: var(--muted); }
  input[type="text"], input[type="search"] { width: 100%; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); color: var(--ink); font: inherit; }
  input:focus { outline: none; border-color: var(--accent); }
  .links { display: flex; gap: 12px; font-size: 12px; }
  .links button { background: none; border: none; padding: 0; color: var(--accent); cursor: pointer; font: inherit; }
  .actions { display: flex; gap: 8px; }
  .btn { padding: 9px 22px; border-radius: 10px; border: 1px solid var(--border); background: var(--panel-2); color: var(--ink); font: inherit; font-weight: 600; cursor: pointer; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-primary { border-color: transparent; background: linear-gradient(135deg, var(--accent), #a78bfa); color: #fff; box-shadow: 0 6px 18px rgb(124 140 255 / 0.35); }
  .btn-danger { color: var(--fail); }

  .single { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 20px; }
  .single-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 12px; }
  .single-head h2 { margin: 0; }
  .btn-small { padding: 5px 12px; font-size: 12px; font-weight: 500; }
  .test-list { height: 360px; overflow: auto; margin-top: 10px; padding: 6px; border-radius: 12px; border: 1px solid var(--border); background: var(--bg); }
  .test-group { padding: 10px 8px 4px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
  .test-item { display: block; width: 100%; text-align: left; padding: 5px 8px; border: 1px solid transparent; border-radius: 8px; background: none; color: var(--ink); font: inherit; font-size: 13px; cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .test-item:hover { background: var(--panel-2); }
  .test-item.selected { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 16%, var(--panel-2)); color: var(--ink-strong); }
  .toggles { display: flex; flex-wrap: wrap; gap: 8px 18px; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--border); background: var(--panel-2); }
  .toggles label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
  .options { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin: 14px 0; }
  .options .field { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; }
  select { width: 100%; padding: 9px 10px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); color: var(--ink); font: inherit; }
  :disabled { opacity: 0.45; cursor: not-allowed; }
  .selected-file { margin-bottom: 12px; font: 12px ui-monospace, Menlo, monospace; color: var(--muted); overflow-wrap: anywhere; }
  .selected-file strong { color: var(--ink-strong); }

  .summary { display: grid; grid-template-columns: auto 1fr auto; gap: 24px; align-items: center; }
  .ring { width: 96px; height: 96px; position: relative; }
  .ring svg { transform: rotate(-90deg); }
  .ring-label { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
  .ring-label strong { font-size: 20px; color: var(--ink-strong); }
  .ring-label small { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
  .status-line { display: flex; align-items: center; gap: 12px; font-size: 16px; font-weight: 600; color: var(--ink-strong); }
  .meta { margin-top: 4px; color: var(--muted); font-size: 13px; }
  .bar { display: flex; height: 10px; border-radius: 999px; overflow: hidden; background: var(--panel-2); margin-top: 14px; }
  .bar span { transition: width 0.4s; }
  .counts { display: flex; gap: 22px; }
  .count { text-align: right; }
  .count strong { display: block; font-size: 24px; line-height: 1.1; }
  .count small { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; }

  .suites { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .suite { position: relative; overflow: hidden; padding: 14px 16px; border-radius: 14px; border: 1px solid var(--border); background: var(--panel); }
  .suite::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 4px; background: var(--suite); }
  .suite-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .suite-name { font-weight: 600; color: var(--ink-strong); text-transform: capitalize; }
  .suite-meta { margin-top: 8px; display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
  .suite .bar { height: 6px; margin-top: 10px; }
  .badge { padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; background: color-mix(in srgb, currentColor 14%, transparent); }
  .s-pending { color: var(--muted); }
  .s-running { color: var(--run); }
  .s-passed { color: var(--pass); }
  .s-failed { color: var(--fail); }
  .s-broken { color: var(--broken); }
  .s-skipped, .s-unknown { color: var(--skip); }
  .s-stopped { color: var(--broken); }

  .split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
  .terminal { margin: 0; height: 420px; overflow: auto; padding: 14px; border-radius: 12px; background: #0b0e14; border: 1px solid var(--border); font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; color: #b8c2d6; white-space: pre-wrap; word-break: break-word; }
  .failures { height: 420px; overflow: auto; display: flex; flex-direction: column; gap: 10px; }
  .failure { text-align: left; width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid color-mix(in srgb, var(--fail) 35%, var(--border)); background: color-mix(in srgb, var(--fail) 6%, var(--panel-2)); color: var(--ink); font: inherit; cursor: pointer; }
  .failure:hover { border-color: var(--fail); }
  .failure-title { font-weight: 600; color: var(--ink-strong); }
  .failure-file { font-size: 12px; color: var(--muted); font-family: ui-monospace, Menlo, monospace; }
  .failure-error { margin-top: 6px; font-size: 12px; color: var(--fail); font-family: ui-monospace, Menlo, monospace; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .thumbs { display: flex; gap: 6px; margin-top: 8px; }
  .thumbs img { width: 72px; height: 48px; object-fit: cover; border-radius: 6px; border: 1px solid var(--border); }
  .empty { display: grid; place-content: center; height: 100%; color: var(--muted); text-align: center; }

  .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
  .tabs { display: flex; gap: 4px; padding: 4px; border-radius: 10px; background: var(--panel-2); border: 1px solid var(--border); }
  .tabs button { padding: 5px 12px; border-radius: 7px; border: none; background: none; color: var(--muted); font: inherit; font-size: 13px; cursor: pointer; }
  .tabs button.active { background: var(--accent); color: #fff; }
  .toolbar input { max-width: 320px; }
  .rows { max-height: 520px; overflow: auto; }
  .row { display: grid; grid-template-columns: 90px 90px minmax(0, 1fr) 70px; gap: 12px; align-items: center; padding: 9px 4px; border-bottom: 1px solid var(--border); cursor: pointer; }
  .row:hover { background: var(--panel-2); }
  .row-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row-suite { font-size: 12px; color: var(--muted); text-transform: capitalize; }
  .row-time { text-align: right; font-size: 12px; color: var(--muted); font-family: ui-monospace, Menlo, monospace; }

  dialog { width: min(1000px, 92vw); max-height: 88vh; padding: 0; border-radius: 16px; border: 1px solid var(--border); background: var(--panel); color: var(--ink); }
  dialog::backdrop { background: rgb(5 8 14 / 0.7); backdrop-filter: blur(3px); }
  .modal-head { display: flex; justify-content: space-between; align-items: start; gap: 16px; padding: 18px 20px; border-bottom: 1px solid var(--border); }
  .modal-body { padding: 18px 20px; overflow: auto; }
  .modal-body pre { margin: 0 0 14px; padding: 12px; border-radius: 10px; background: #0b0e14; border: 1px solid var(--border); font: 12px/1.6 ui-monospace, Menlo, monospace; white-space: pre-wrap; word-break: break-word; }
  .modal-body pre.error { color: var(--fail); }
  .evidence img, .evidence video { display: block; max-width: 100%; margin-bottom: 12px; border-radius: 10px; border: 1px solid var(--border); }
  .evidence a { display: inline-block; margin: 0 12px 12px 0; color: var(--accent); }

  @media (max-width: 900px) {
    .split, .summary, .controls, .single { grid-template-columns: 1fr; }
    .options { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .counts { justify-content: space-between; }
    .row { grid-template-columns: 80px minmax(0, 1fr) 60px; }
    .row-suite { display: none; }
  }
</style>
</head>
<body>
<div class="page">
  <header>
    <div>
      <h1>Dorit <span>Local</span> Test Runner</h1>
      <p class="subtitle">Runs scripts/run-tests.sh on this machine and shows every failure with its evidence.</p>
    </div>
    <span class="pill" id="connection"><span class="dot"></span>Connecting</span>
  </header>

  <section class="card">
    <h2>Suites</h2>
    <div class="chips" id="suiteChips"></div>
    <div class="controls">
      <label class="field">Extra flags as --flag=value, for example --project=web-chromium or --grep="home page"
        <input type="text" id="args" placeholder="--project=web-chromium">
      </label>
      <div class="actions">
        <button class="btn btn-primary" id="run">Run</button>
        <button class="btn btn-danger" id="stop" disabled>Stop</button>
      </div>
    </div>
    <div class="meta" id="runError" style="color:var(--fail)" hidden></div>
    <div class="links" style="margin-top:10px">
      <button id="selectAll">Select all</button>
      <button id="selectNone">Clear</button>
    </div>
  </section>

  <section class="card single">
    <div>
      <div class="single-head">
        <h2>Single test <span id="testCount"></span></h2>
        <button class="btn btn-small" id="refreshTests">Refresh test list</button>
      </div>
      <input type="search" id="testFilter" placeholder="Filter tests by name, path or folder">
      <div class="test-list" id="testList"></div>
    </div>
    <div>
      <div class="selected-file" id="selectedFile">Select a test file from the list</div>
      <div class="toggles">
        <label><input type="checkbox" id="optDebug" data-playwright> Debug (Inspector)</label>
        <label><input type="checkbox" id="optHeaded" data-playwright> Headed</label>
        <label><input type="checkbox" id="optUi" data-playwright> UI mode</label>
        <label><input type="checkbox" id="optList"> List only</label>
      </div>
      <div class="options">
        <label class="field">Trace
          <select id="optTrace" data-playwright>
            <option value="">default</option>
            <option>retain-on-failure</option>
            <option>on</option>
            <option>off</option>
            <option>on-first-retry</option>
            <option>on-all-retries</option>
          </select>
        </label>
        <label class="field">Reporter (+Allure)
          <select id="optReporter" data-playwright>
            <option value="">default</option>
            <option>list</option>
            <option>line</option>
            <option>dot</option>
          </select>
        </label>
        <label class="field">Project
          <select id="optProject" data-playwright>
            <option value="">web-chromium</option>
            <option>web-webkit</option>
            <option>ios-safari</option>
            <option>android-chrome</option>
            <option value="*">all projects</option>
          </select>
        </label>
        <label class="field">Workers<input type="text" inputmode="numeric" id="optWorkers" data-playwright></label>
        <label class="field">Retries<input type="text" inputmode="numeric" id="optRetries"></label>
        <label class="field">Repeat each<input type="text" inputmode="numeric" id="optRepeatEach" data-playwright></label>
        <label class="field">Timeout (ms)<input type="text" inputmode="numeric" id="optTimeout"></label>
        <label class="field">Max failures<input type="text" inputmode="numeric" id="optMaxFailures"></label>
        <label class="field">Shard (n/m)<input type="text" id="optShard" placeholder="1/3"></label>
        <label class="field">Grep<input type="text" id="optGrep" placeholder="title text"></label>
        <label class="field">Grep invert<input type="text" id="optGrepInvert" placeholder="exclude" data-playwright></label>
      </div>
      <button class="btn btn-primary" id="runSingle" disabled>Run single test</button>
      <div class="meta" id="singleError" style="color:var(--fail)" hidden></div>
    </div>
  </section>

  <section class="card summary">
    <div class="ring">
      <svg width="96" height="96" viewBox="0 0 96 96">
        <circle cx="48" cy="48" r="40" fill="none" stroke="var(--panel-2)" stroke-width="10"/>
        <circle id="ringValue" cx="48" cy="48" r="40" fill="none" stroke="var(--pass)" stroke-width="10" stroke-linecap="round" stroke-dasharray="0 252"/>
      </svg>
      <div class="ring-label"><strong id="passRate">-</strong><small>pass rate</small></div>
    </div>
    <div>
      <div class="status-line"><span class="pill" id="runStatus"><span class="dot"></span>Idle</span><span id="elapsed"></span></div>
      <div class="meta" id="suiteProgress">No run yet</div>
      <div class="bar" id="totalBar"></div>
    </div>
    <div class="counts" id="counts"></div>
  </section>

  <div class="suites" id="suiteCards"></div>

  <div class="split">
    <section class="card">
      <h2>Live output</h2>
      <pre class="terminal" id="log"></pre>
    </section>
    <section class="card">
      <h2>Failures</h2>
      <div class="failures" id="failures"></div>
    </section>
  </div>

  <section class="card">
    <div class="toolbar">
      <div class="tabs" id="filters"></div>
      <input type="search" id="search" placeholder="Search tests">
    </div>
    <div class="rows" id="rows"></div>
  </section>
</div>

<dialog id="modal">
  <div class="modal-head">
    <div>
      <div class="failure-title" id="modalTitle"></div>
      <div class="failure-file" id="modalFile"></div>
    </div>
    <button class="btn" id="modalClose">Close</button>
  </div>
  <div class="modal-body" id="modalBody"></div>
</dialog>

<script>
  const SUITES = {
    lint: { color: "#38bdf8", label: "lint" },
    typecheck: { color: "#818cf8", label: "typecheck" },
    unit: { color: "#34d399", label: "unit" },
    component: { color: "#a78bfa", label: "component" },
    contract: { color: "#fbbf24", label: "contract" },
    integration: { color: "#2dd4bf", label: "integration" },
    security: { color: "#fb7185", label: "security (static)" },
    build: { color: "#94a3b8", label: "build" },
    e2e: { color: "#f472b6", label: "e2e (web + iOS + Android)" },
  };
  const SELECTABLE = Object.keys(SUITES).filter((key) => key !== "build");
  const FAILED = ["failed", "broken"];
  const FILTERS = ["all", "failed", "passed", "skipped"];
  const RING = 2 * Math.PI * 40;

  const $ = (id) => document.getElementById(id);
  const state = {
    startedAt: undefined,
    offset: 0,
    log: "",
    partial: "",
    starts: new Set(),
    ends: {},
    run: null,
    results: [],
    filter: "failed",
    ticks: 0,
    tests: [],
    selectedTest: null,
  };

  function element(tag, props = {}, children = []) {
    const node = Object.assign(document.createElement(tag), props);
    node.append(...children);
    return node;
  }

  function seconds(ms) {
    const total = Math.round(ms / 1000);
    return total < 60 ? `${total}s` : `${Math.floor(total / 60)}m ${total % 60}s`;
  }

  function suiteOf(result) {
    if (result.framework === "playwright") return "e2e";
    return result.fullName?.match(/tests\/(\w+)\//)?.[1] || "other";
  }

  function fileOf(result) {
    return result.fullName?.match(/[\w./-]+\.(spec|test)\.tsx?/)?.[0] || "";
  }

  function statusOf(result) {
    return FAILED.includes(result.status) ? "failed" : result.status === "passed" ? "passed" : "skipped";
  }

  function tally(results) {
    const counts = { passed: 0, failed: 0, skipped: 0 };
    for (const result of results) counts[statusOf(result)] += 1;
    return counts;
  }

  function stackedBar(target, counts) {
    const total = counts.passed + counts.failed + counts.skipped;
    target.replaceChildren(
      ...["passed", "failed", "skipped"].map((key) =>
        element("span", { style: `width:${total ? (counts[key] / total) * 100 : 0}%;background:var(--${key === "skipped" ? "skip" : key === "passed" ? "pass" : "fail"})` }),
      ),
    );
  }

  // Banners are read once, line by line, as output arrives; a line still being
  // written waits in state.partial until its newline (or the end of the run).
  function scanLines(lines) {
    for (const line of lines) {
      for (const [key, { label }] of Object.entries(SUITES)) {
        if (line.startsWith(`┌─ ${label} `)) state.starts.add(key);
        else if (line.startsWith(`└─ ${label} `)) state.ends[key] ??= line;
      }
    }
  }

  function appendLog(output, running) {
    state.log += output;
    const lines = (state.partial + output).split("\n");
    state.partial = lines.pop();
    if (!running && state.partial) {
      lines.push(state.partial);
      state.partial = "";
    }
    scanLines(lines);
  }

  function suiteStatus(key) {
    const end = state.ends[key];
    if (end) {
      const duration = end.match(/\((\d+)s\)/)?.[1];
      const status = end.includes(" passed") ? "passed" : end.includes("known failures") ? "broken" : "failed";
      return { status, duration: duration ? `${duration}s` : "" };
    }
    if (state.starts.has(key)) {
      return { status: state.run?.running ? "running" : "stopped", duration: "" };
    }
    return { status: "pending", duration: "" };
  }

  function runSuites() {
    const chosen = state.run?.suites || [];
    return Object.keys(SUITES).filter((key) => chosen.includes(key) || (key === "build" && chosen.includes("e2e")));
  }

  function renderChips() {
    $("suiteChips").replaceChildren(
      ...SELECTABLE.map((key) =>
        element("label", { className: "chip", style: `--suite:${SUITES[key].color}` }, [
          element("input", { type: "checkbox", value: key, checked: key === "unit" }),
          element("span", { className: "dot" }),
          key,
        ]),
      ),
    );
  }

  function selectedSuites() {
    return [...document.querySelectorAll("#suiteChips input:checked")].map((box) => box.value);
  }

  function renderSummary() {
    const run = state.run;
    const counts = tally(state.results);
    counts.failed += unreportedFailures().length;
    const total = counts.passed + counts.failed + counts.skipped;
    const executed = counts.passed + counts.failed;
    const rate = executed ? Math.round((counts.passed / executed) * 100) : null;

    $("passRate").textContent = rate === null ? "-" : `${rate}%`;
    $("ringValue").setAttribute("stroke-dasharray", `${((rate || 0) / 100) * RING} ${RING}`);
    $("ringValue").setAttribute("stroke", counts.failed || (run?.finishedAt && run.exitCode !== 0) ? "var(--fail)" : "var(--pass)");

    let label = "Idle";
    let tone = "s-pending";
    if (run?.running) [label, tone] = ["Running", "s-running"];
    else if (run?.finishedAt && run.exitCode === 0) [label, tone] = ["Passed", "s-passed"];
    else if (run?.finishedAt && typeof run.exitCode === "string") [label, tone] = ["Stopped", "s-stopped"];
    else if (run?.finishedAt) [label, tone] = ["Failed", "s-failed"];

    $("runStatus").className = `pill ${tone}`;
    $("runStatus").replaceChildren(element("span", { className: `dot${run?.running ? " pulse" : ""}` }), label);
    $("elapsed").textContent = run?.startedAt ? seconds((run.finishedAt || Date.now()) - run.startedAt) : "";

    const suites = runSuites();
    const done = suites.filter((key) => !["pending", "running"].includes(suiteStatus(key).status)).length;
    if (run?.single) $("suiteProgress").textContent = `${run.single}, ${total} tests reported`;
    else $("suiteProgress").textContent = suites.length ? `${done} of ${suites.length} suites finished, ${total} tests reported` : "No run yet";
    stackedBar($("totalBar"), counts);

    $("counts").replaceChildren(
      ...[["passed", "pass"], ["failed", "fail"], ["skipped", "skip"]].map(([key, color]) =>
        element("div", { className: "count" }, [
          element("strong", { textContent: counts[key], style: `color:var(--${color})` }),
          element("small", { textContent: key }),
        ]),
      ),
    );
  }

  function renderSuiteCards() {
    const bySuite = Object.groupBy(state.results, suiteOf);
    $("suiteCards").replaceChildren(
      ...runSuites().map((key) => {
        const { status, duration } = suiteStatus(key);
        const results = bySuite[key] || [];
        const counts = tally(results);
        const bar = element("div", { className: "bar" });
        stackedBar(bar, counts);
        return element("div", { className: "suite", style: `--suite:${SUITES[key].color}` }, [
          element("div", { className: "suite-head" }, [
            element("span", { className: "suite-name", textContent: key }),
            element("span", { className: `badge s-${status}`, textContent: status }),
          ]),
          bar,
          element("div", { className: "suite-meta" }, [
            element("span", { textContent: results.length ? `${counts.passed} passed, ${counts.failed} failed` : "No tests reported" }),
            element("span", { textContent: duration }),
          ]),
        ]);
      }),
    );
  }

  function attachmentUrl(attachment) {
    return `/files/${encodeURIComponent(attachment.source)}`;
  }

  function suiteOutput(key) {
    const { label } = SUITES[key];
    const start = state.log.indexOf(`┌─ ${label} `);
    const end = state.log.indexOf(`└─ ${label} `, start);
    return start === -1 ? "" : state.log.slice(start, end === -1 ? undefined : state.log.indexOf("\n", end));
  }

  function errorLines(output) {
    return output
      .split("\n")
      .filter((line) => /\b(FAIL|Error|error TS\d+)\b|✗|×/.test(line))
      .slice(0, 20)
      .join("\n");
  }

  function singleFailure() {
    const run = state.run;
    const failed = run?.finishedAt && run.exitCode !== 0;
    if (!failed || state.results.some((result) => FAILED.includes(result.status))) return [];
    return [{
      name: `${run.single} failed without a test result`,
      fullName: "",
      status: "failed",
      duration: 0,
      message: errorLines(state.log) || "The run exited with an error before reporting a test result.",
      trace: state.log,
      attachments: [],
    }];
  }

  function unreportedFailures() {
    if (state.run?.single) return singleFailure();
    const reported = new Set(state.results.filter((result) => FAILED.includes(result.status)).map(suiteOf));
    return runSuites()
      .filter((key) => suiteStatus(key).status === "failed" && !reported.has(key))
      .map((key) => ({
        name: `${key} failed without a test result`,
        fullName: "",
        status: "failed",
        duration: 0,
        message: errorLines(suiteOutput(key)) || "The suite exited with an error before reporting results for every test.",
        trace: suiteOutput(key),
        attachments: [],
      }));
  }

  function renderFailures() {
    const failures = [...unreportedFailures(), ...state.results.filter((result) => FAILED.includes(result.status))];
    if (!failures.length) {
      $("failures").replaceChildren(element("div", { className: "empty", textContent: state.run?.running ? "No failures so far" : "No failures" }));
      return;
    }
    $("failures").replaceChildren(
      ...failures.map((result) => {
        const images = result.attachments.filter((attachment) => attachment.type?.startsWith("image/")).slice(0, 3);
        const card = element("button", { className: "failure", onclick: () => openResult(result) }, [
          element("div", { className: "failure-title", textContent: result.name }),
          element("div", { className: "failure-file", textContent: fileOf(result) }),
          element("div", { className: "failure-error", textContent: result.message }),
        ]);
        if (images.length) {
          card.append(element("div", { className: "thumbs" }, images.map((image) => element("img", { src: attachmentUrl(image), alt: image.name }))));
        }
        return card;
      }),
    );
  }

  function renderRows() {
    const query = $("search").value.trim().toLowerCase();
    const counts = tally(state.results);
    $("filters").replaceChildren(
      ...FILTERS.map((filter) =>
        element("button", {
          className: filter === state.filter ? "active" : "",
          textContent: filter === "all" ? `All ${state.results.length}` : `${filter} ${counts[filter]}`,
          onclick: () => {
            state.filter = filter;
            renderRows();
          },
        }),
      ),
    );

    const visible = state.results
      .filter((result) => state.filter === "all" || statusOf(result) === state.filter)
      .filter((result) => !query || `${result.name} ${result.fullName}`.toLowerCase().includes(query))
      .toSorted((a, b) => b.duration - a.duration);

    $("rows").replaceChildren(
      ...visible.slice(0, 500).map((result) =>
        element("div", { className: "row", onclick: () => openResult(result) }, [
          element("span", { className: `badge s-${result.status}`, textContent: result.status }),
          element("span", { className: "row-suite", textContent: suiteOf(result) }),
          element("span", { className: "row-name", textContent: result.name, title: fileOf(result) }),
          element("span", { className: "row-time", textContent: `${(result.duration / 1000).toFixed(2)}s` }),
        ]),
      ),
    );
  }

  function renderEvidence(attachment) {
    const src = attachmentUrl(attachment);
    if (attachment.type?.startsWith("image/")) return element("img", { src, alt: attachment.name });
    if (attachment.type?.startsWith("video/")) return element("video", { src, controls: true });
    return element("a", { href: src, download: attachment.source, textContent: `Download ${attachment.name}` });
  }

  function openResult(result) {
    $("modalTitle").textContent = result.name;
    $("modalFile").textContent = fileOf(result);
    const body = [];
    if (result.message) body.push(element("pre", { className: "error", textContent: result.message }));
    if (result.trace) body.push(element("pre", { textContent: result.trace }));
    if (result.attachments.length) body.push(element("div", { className: "evidence" }, result.attachments.map(renderEvidence)));
    if (!body.length) body.push(element("p", { className: "meta", textContent: "No details recorded for this test." }));
    $("modalBody").replaceChildren(...body);
    $("modal").showModal();
  }

  function renderTests() {
    const query = $("testFilter").value.trim().toLowerCase();
    const visible = state.tests.filter((file) => file.toLowerCase().includes(query));
    const groups = Object.groupBy(visible, (file) => file.slice(0, file.lastIndexOf("/")));
    $("testCount").textContent = `${state.tests.length} files`;
    $("testList").replaceChildren(
      ...Object.entries(groups).flatMap(([folder, files]) => [
        element("div", { className: "test-group", textContent: folder }),
        ...files.map((file) =>
          element("button", {
            className: `test-item${file === state.selectedTest ? " selected" : ""}`,
            textContent: file.slice(folder.length + 1),
            title: file,
            onclick: () => selectTest(file),
          }),
        ),
      ]),
    );
  }

  function selectTest(file) {
    state.selectedTest = file;
    const playwright = file.startsWith("e2e/");
    $("selectedFile").replaceChildren(element("strong", { textContent: file }), ` runs with ${playwright ? "Playwright" : "Vitest"}`);
    document.querySelectorAll("[data-playwright]").forEach((input) => (input.disabled = !playwright));
    $("runSingle").disabled = Boolean(state.run?.running);
    renderTests();
  }

  async function loadTests() {
    state.tests = await (await fetch("/api/tests")).json();
    renderTests();
  }

  function singleFlags() {
    const value = (id) => $(id).value;
    const checked = (id) => $(id).checked && !$(id).disabled;
    return {
      debug: checked("optDebug"),
      headed: checked("optHeaded"),
      ui: checked("optUi"),
      list: checked("optList"),
      trace: value("optTrace"),
      reporter: value("optReporter"),
      project: value("optProject"),
      workers: value("optWorkers"),
      retries: value("optRetries"),
      repeatEach: value("optRepeatEach"),
      timeout: value("optTimeout"),
      maxFailures: value("optMaxFailures"),
      shard: value("optShard"),
      grep: value("optGrep"),
      grepInvert: value("optGrepInvert"),
    };
  }

  function renderAll() {
    renderSummary();
    renderSuiteCards();
    renderFailures();
    renderRows();
  }

  function setConnection(online) {
    $("connection").className = `pill ${online ? "s-passed" : "s-failed"}`;
    $("connection").replaceChildren(element("span", { className: "dot" }), online ? "Server connected" : "Server offline");
  }

  async function loadResults() {
    state.results = await (await fetch("/api/results")).json();
  }

  async function fetchState(since) {
    return (await fetch(`/api/state?since=${since}`)).json();
  }

  function resetForRun(startedAt) {
    Object.assign(state, { startedAt, offset: 0, log: "", partial: "", starts: new Set(), ends: {}, results: [], filter: "failed", ticks: 0 });
    $("log").textContent = "";
  }

  async function pollOnce() {
    try {
      let run = await fetchState(state.offset);
      // A different run from the one on screen: started here, in another tab, by
      // curl, or the server restarted. Its output has to be read from the start.
      const newRun = run.startedAt !== state.startedAt;
      if (newRun) {
        if (state.offset) run = await fetchState(0);
        resetForRun(run.startedAt);
      }
      setConnection(true);
      const log = $("log");
      const atBottom = log.scrollTop + log.clientHeight >= log.scrollHeight - 8;
      appendLog(run.output, run.running);
      state.offset = run.length;
      log.append(run.output);
      if (atBottom) log.scrollTop = log.scrollHeight;

      const finished = state.run?.running && !run.running;
      const changed = newRun || finished || Boolean(run.output);
      state.run = run;
      state.ticks += 1;
      // An idle tab doesn't re-read allure-results: nothing writes it between runs.
      if (newRun || finished || (run.running && state.ticks % 3 === 0)) await loadResults();

      $("run").disabled = run.running;
      $("runSingle").disabled = run.running || !state.selectedTest;
      $("stop").disabled = !run.running;
      if (run.running || changed) renderAll();
      return run;
    } catch {
      setConnection(false);
      return null;
    }
  }

  // Polls run one after another, never side by side, so two can't read the
  // same offset and append the same output twice.
  let polls = Promise.resolve();
  function poll() {
    polls = polls.then(pollOnce);
    return polls;
  }

  async function pollLoop() {
    const run = await poll();
    setTimeout(pollLoop, run?.running ? 1000 : 5000);
  }

  function post(path, body = {}) {
    return fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  }

  async function start(path, body, errorId) {
    const response = await post(path, body);
    const error = response.ok ? "" : (await response.json().catch(() => ({}))).error || `The server answered ${response.status}`;
    $(errorId).textContent = error;
    $(errorId).hidden = !error;
    if (response.ok) await poll();
  }

  $("run").addEventListener("click", () => start("/api/run", { suites: selectedSuites(), args: $("args").value }, "runError"));
  $("runSingle").addEventListener("click", () => start("/api/run-single", { file: state.selectedTest, flags: singleFlags() }, "singleError"));
  $("testFilter").addEventListener("input", renderTests);
  $("refreshTests").addEventListener("click", loadTests);

  $("stop").addEventListener("click", () => post("/api/stop"));
  $("search").addEventListener("input", renderRows);
  $("modalClose").addEventListener("click", () => $("modal").close());
  $("modal").addEventListener("click", (event) => event.target === $("modal") && $("modal").close());
  $("selectAll").addEventListener("click", () => document.querySelectorAll("#suiteChips input").forEach((box) => (box.checked = true)));
  $("selectNone").addEventListener("click", () => document.querySelectorAll("#suiteChips input").forEach((box) => (box.checked = false)));

  renderChips();
  loadTests();
  pollLoop();
</script>
</body>
</html>
