    <!-- LCP: the hero portrait is the largest element above the fold on every
         viewport. Preloading it starts the fetch during HTML parse instead of
         after the JS bundle mounts React — the single biggest mobile LCP win. -->
    <!-- AVIF only: a browser without AVIF skips this preload and the <picture>
         in Hero.tsx falls back to WebP. srcset/sizes must match Hero.tsx
         exactly, or the browser preloads one file and renders another.
         Below md the portrait is an 88px circle, so `sizes` ends in 88px and
         a phone preloads the 480 file. -->
    <link rel="preload" as="image" type="image/avif" fetchpriority="high"
      imagesrcset="/images/dorit-office-portrait-480.avif 480w, /images/dorit-office-portrait-768.avif 768w, /images/dorit-office-portrait-1080.avif 1080w"
      imagesizes="(min-width: 1024px) 490px, (min-width: 768px) calc(100vw - 40px), 88px" />

    <link rel="preload" as="font" type="font/woff2" href="/fonts/heebo-hebrew-400-normal.woff2" crossorigin />

         to pages that are, so entries that are not weaken the match they were
         added to strengthen. Put real ones back as they appear — the Google
         Business Profile, LinkedIn, the actual Midrag listing.

    <!-- Google Analytics 4. With VITE_GA_CONSENT on, only after the visitor agreed (src/lib/consent.ts). The flag
         reaches the script through this meta, so the script's text and its CSP hash in vercel.json never change. -->
    <meta name="ga-consent" content="%VITE_GA_CONSENT%" />
    <script>
      window.dataLayer = window.dataLayer || [];
      (function () {
        var id = 'G-LLSYPMGV58';
        var meta = document.querySelector('meta[name="ga-consent"]');
        var choice = null;
        try { choice = localStorage.getItem('ga-consent'); } catch (e) {}
        // Asked, and not (yet) agreed: no gtag at all, so nothing is sent or queued.
        if (meta && meta.content === 'true' && choice !== 'granted') return;
        window.gtag = function () { dataLayer.push(arguments); };
        // The admin area is never measured: its URLs carry searches and record ids (src/lib/analytics.ts, measureRoute).
        if (/^\/admin(\/|$)/.test(location.pathname)) window['ga-disable-' + id] = true;
        gtag('js', new Date());
        gtag('config', id);
        if (!document.querySelector('script[src^="https://www.googletagmanager.com/gtag/js"]')) {
          var s = document.createElement('script');
          s.async = true;
          s.src = 'https://www.googletagmanager.com/gtag/js?id=' + id;
          document.head.appendChild(s);
        }
      })();
      try { var theme = localStorage.getItem('theme'); if (theme === 'dark' || (!theme && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark'); } catch (e) {}
    </script>
